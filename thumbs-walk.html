    <!--
    thumbs-walk.html: three thumbs, walking, checked exactly (13 November 2026, SPN R930, plans/twk-plan.md; Tom: "I want
    to see the math in action with the 3 thumbs and omega, 3d cauchy and the simplifed euhler's identity. Lets talk about
    how we can make that rigorous, and let the user walk around looking at his environment."; "new page, use omega, flat
    screen default, walking with w a s d. No support for mobile, desktop only.").
    A first-person wireframe on whole numbers. Every vertex is an integer point made from its ground cell; the three thumbs
    are the columns of a product of rational turns (half-slopes p/q), so the frame is orthonormal in fractions; the look is
    the thumbs' diagonal, so the crosshair is the triple corner; W A S D walk by counted strides of 1/4 along a rational
    heading. For the thing under the crosshair every reading is a fraction, and the identities are checked in exact BigInt
    arithmetic: the three pair slopes multiply to 1; w(s)·w(1/s) = −1 for each pair; scaling the world moves no slope;
    walking straight lowers the reach along the look by the same amount each stride, and two looks a stride apart give
    the strides left. Where Ω itself enters (the shares of a sweep, the heat's total) the check is in floating point.
    The flat screen square to the look: one division per point, edges straight, the heat per unit of screen
    1/(4Ω(1 + r²)^(3/2)). Text behind the menu (☰). Desktop only.
    Re-anchoring (R931): the frame is recomputed from one current turn each pose, so its denominators stay bounded (the
    tower's middle terms cancel); the eye is a running total of strides, so at each new heading it is put down on the
    nearest point of the 1/16 grid (a write; only the exact path home is lost). ?anchor=0 keeps every heading in it.
    No trigonometry (R932): the look is held as whole numbers (quarter turns q and half-slopes ky/128, kp/128), a drag or
    an arrow key steps a half-slope, an eighth of a turn passes to the next quarter by tangent subtraction; the screen's
    half-width is a slope of 6/5; the rings are drawn from rational points; the sky is uniform by a ball normalized.
    Only the Ω shares (K3) use atan, for display and that check alone. Hook trigFree(steps) counts trig calls.
    ?q=&ky=&kp=&x=&z=&menu=1&sky=1&heat=0&thumbs=0&anchor=0
    Hook window.__thumbsWalk: Fr (fractions), exact(), checks(), set({q, ky, kp, eye}), trigFree(steps), stride(dir, n), target(),
    state(), sky().
    -->

<body>
<canvas id="cv"></canvas>
<button id="menuBtn" title="menu (M)">☰</button>
<div id="panel">
    <h2>Three thumbs, walking</h2>
    <p>W A S D walk (shift: eight strides at a time), drag or the arrow keys turn, the wheel sets the thumb, H holds it, M the menu.</p>
    <h3>show</h3>
    <label><input type="checkbox" id="optThumbs" checked> the three thumbs and the wedge</label>
    <label><input type="checkbox" id="optHeat" checked> the heat, 1/(4Ω(1 + r²)^(3/2)), and its rings of equal share</label>
    <label><input type="checkbox" id="optSky"> a seeded sky of 40,000 directions</label>
    <label><input type="checkbox" id="optRead" checked> the readout</label>
    <label><input type="checkbox" id="optEuler" checked> Euler, simplified</label>
    <label><input type="checkbox" id="optOmega" checked> the shares in Ω</label>
    <label><input type="checkbox" id="optWalk" checked> the counted walk</label>
    <label><input type="checkbox" id="optChecks"> the checks</label>
    <label><input type="checkbox" id="optAnchor" checked> re-anchor the eye at each new heading (take the scaffolding down)</label>
    <label><input type="checkbox" id="optAbout"> about</label>
    <div id="out"></div>

<script>
'use strict';
// ---------- exact fractions (BigInt) ----------
const Fr = (() => {

        sub: (a, b) => make(a.n * b.d - b.n * a.d, a.d * b.d),
        mul: (a, b) => make(a.n * b.n, a.d * b.d),
        div: (a, b) => make(a.n * b.d, a.d * b.n),

        num: (a) => {   // to a double, safe for large parts
            const ln = a.n.toString().length, ld = a.d.toString().length, sh = Math.max(0, Math.max(ln, ld) - 300);
            if (!sh) return Number(a.n) / Number(a.d);

})();
const ZERO = Fr.make(0), ONE = Fr.make(1);

// rational turn from the half-slope u = p/q: c = (q² − p²)/(q² + p²), s = 2pq/(q² + p²)
function turnCS(p, q) { p = BigInt(p); q = BigInt(q); const den = q * q + p * p; return [Fr.make(q * q - p * p, den), Fr.make(2n * p * q, den)]; }
function matMul(A, B) {   // 3×3 of fractions, row-major arrays of 9
    const C = new Array(9);
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {

}
function Ry(c, s) { return [c, ZERO, s, ZERO, ONE, ZERO, Fr.neg(s), ZERO, c]; }       // x' = c x + s z, z' = −s x + c z
function Rx(c, s) { return [ONE, ZERO, ZERO, ZERO, c, Fr.neg(s), ZERO, s, c]; }       // y' = c y − s z, z' = s y + c z

// axis and near 35.26° about the east axis; the look is the diagonal of whatever frame results, exactly.
const BASE = matMul(Rx(...turnCS(7, 22)), Ry(...turnCS(-29, 70)));
const QD = 128n;   // yaw and pitch held as half-slopes k/128

// ---------- the world, made from its cells ----------
// at every scale: level j has cells CELL·2^j wide, each holding at most one thing with every length times 2^j; a thing
// is kept when its breadth b is at least G times its distance d (compared in squares), so what is held is set by the
// grain and the number of levels, never by how far the world goes (TWK run 4)
// Since TWK run 5: scales below 0 too (?below=), and each scale's grain set so it holds its Cauchy share (?share=cauchy,
// the default): the heat per ratio (1/π)·sech(ln s), so scale j at k = j − j* from the focus gets the grain
// G·√cosh(k·ln 2) (on a ground the count kept goes as 1/grain²), cosh computed as (2^k + 2^−k)/2.
const QS = new URLSearchParams(location.search);
const CELL = 24, LEVELS = Math.max(0, Math.min(40, Math.round(+(QS.get('levels') ?? 8)))),
    BELOW = Math.max(0, Math.min(40, Math.round(+(QS.get('below') ?? 8)))), SHARE = QS.get('share') === 'flat' ? 'flat' : 'cauchy',
    GRAIN = 1 / 32, BMAX = 32, SCAN = Math.ceil(BMAX / GRAIN / CELL) + 1;   // 44 cells at the focus's grain
const coshL = k => (2 ** k + 2 ** -k) / 2;
function grainAt(lv) { return SHARE === 'flat' ? GRAIN : GRAIN * Math.sqrt(coshL(lv - S.focus)); }
function scanAt(lv) { return Math.ceil(BMAX / (grainAt(lv) * CELL)) + 1; }
function hash(i, j, s) {
    let h;
    if (Math.abs(i) < 1048576 && Math.abs(j) < 1048576) h = (i * 374761393 + j * 668265263 + s * 2246822519) | 0;
    else {   // large indices (small scales far from the origin): mix the high and low words, so cells do not repeat
        const hi = Math.floor(i / 4294967296), lo = i - hi * 4294967296, hj = Math.floor(j / 4294967296), lj = j - hj * 4294967296;
        h = Math.imul(lo | 0, 374761393) ^ Math.imul(lj | 0, 668265263) ^ Math.imul(hi | 0, 1103515245) ^ Math.imul(hj | 0, 1664525)
            ^ Math.imul(s | 0, 2246822519 | 0); }
    h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
const cellCache = new Map();
function thingOf(i, j, lv = 0) {
    const key = lv + ':' + i + ',' + j; if (cellCache.has(key)) return cellCache.get(key);
    let t = null; const L = 64 * lv, sc = 2 ** lv;
    const hash0 = hash; { const hash = (a, b, k) => hash0(a, b, k + L);
    if (hash(i, j, 1) < 0.42 && !(lv === 0 && Math.abs(i) <= 1 && Math.abs(j) <= 1)) {
        const r = hash(i, j, 2), x0 = i * CELL + 2 + Math.floor(hash(i, j, 3) * 10), z0 = j * CELL + 2 + Math.floor(hash(i, j, 4) * 10);
        if (r < 0.45) { const w = 4 + 2 * Math.floor(hash(i, j, 5) * 4), d = 4 + 2 * Math.floor(hash(i, j, 6) * 4), h = 2 + 2 * Math.floor(hash(i, j, 7) * 4);
            t = { kind: 'box', x0, z0, w, d, h }; }
        else if (r < 0.75) { const w = 2 + 2 * Math.floor(hash(i, j, 5) * 2), h = 10 + 2 * Math.floor(hash(i, j, 7) * 12);
            t = { kind: 'tower', x0, z0, w, d: w, h }; }
        else { const w = 6 + 2 * Math.floor(hash(i, j, 5) * 4), h = 4 + 2 * Math.floor(hash(i, j, 7) * 5);
            t = { kind: 'pyramid', x0, z0, w, d: w, h }; }
        if (sc !== 1) { t.x0 = i * CELL * sc + (t.x0 - i * CELL) * sc; t.z0 = j * CELL * sc + (t.z0 - j * CELL) * sc;
            t.w *= sc; t.d *= sc; t.h *= sc; }
        t.key = key; t.lv = lv; t.b = Math.max(t.w, t.d, t.h);

        t.c = [t.x0 + t.w / 2, t.h / 2, t.z0 + t.d / 2];

}
function edgesOf(t) {
    const { x0, z0, w, d, h } = t, x1 = x0 + w, z1 = z0 + d, E = [];
    if (t.kind === 'pyramid') {
        const ax = x0 + w / 2, az = z0 + d / 2, b = [[x0, 0, z0], [x1, 0, z0], [x1, 0, z1], [x0, 0, z1]];
        for (let k = 0; k < 4; k++) { E.push([b[k], b[(k + 1) % 4]]); E.push([b[k], [ax, h, az]]); }
        return E;
    }
    const v = (a, y, c) => [a, y, c];
    const bot = [v(x0, 0, z0), v(x1, 0, z0), v(x1, 0, z1), v(x0, 0, z1)], top = bot.map(p => [p[0], h, p[2]]);
    for (let k = 0; k < 4; k++) { E.push([bot[k], bot[(k + 1) % 4]]); E.push([top[k], top[(k + 1) % 4]]); E.push([bot[k], top[k]]); }

}

    const dx = t.c[0] - e[0], dy = t.c[1] - e[1], dz = t.c[2] - e[2], d2 = dx * dx + dy * dy + dz * dz;
    return t.b * t.b >= g * g * d2 && d2 >= t.b * t.b;

        const w = CELL * 2 ** lv, ci = Math.floor(e[0] / w), cj = Math.floor(e[2] / w); let n = 0;

// ---------- the pose ----------
const params = new URLSearchParams(location.search);
const S = {
    // the look held as whole numbers: q quarter turns and two half-slopes ky/128 (across) and kp/128 (up); no angle
    q: Math.round(+params.get('q') || 0), ky: Math.round(+params.get('ky') || 0), kp: Math.round(+params.get('kp') || 0), dragX: 0, dragY: 0,
    eye: [Fr.make(params.get('x') ? Math.round(+params.get('x')) : 0), Fr.make(2), Fr.make(params.get('z') ? Math.round(+params.get('z')) : -30)],
    H: null, holdH: false, target: null, lastPoseKey: '', focus: 0, holdFocus: false,
    walk: { key: null, m: [], strides: 0 },
    anchor: params.get('anchor') !== '0', anchors: 0, lastHeading: null,
    show: { thumbs: params.get('thumbs') !== '0', heat: params.get('heat') !== '0', sky: params.get('sky') === '1',

const STRIDE = Fr.make(1, 4), GRID = 16n;
function strideNow() { return S.focus >= 0 ? STRIDE : Fr.make(1, 4n * 2n ** BigInt(-S.focus)); }   // the stride shrinks with the focus's scale
// re-anchoring: the eye put down at the nearest point of the 1/16 grid (a write; only the exact path home is lost)

// turning by half-slopes, no trigonometry: past an eighth of a turn either way the half-slope u passes to the next
// quarter turn by tangent subtraction, u' = (u − 1)/(1 + u) or (u + 1)/(1 − u), rounded to the nearest k/128

// ---------- readings ----------
function thumbCoordsExact(t, E, R, k) {   // x = Rᵀ (C − E), optional world scale k (a fraction)
    const C = t.c.map(v => Fr.dy(v));

    return [0, 1, 2].map(j => Fr.add(Fr.add(Fr.mul(R[j], v[0]), Fr.mul(R[3 + j], v[1])), Fr.mul(R[6 + j], v[2])));

    if (!t) return null;

    const facing = x.every(v => Fr.sign(v) > 0) ? 'this wedge' : 'another facing';
    const pairs = PAIRS.map(([p, q, i, j]) => {
        if (Fr.zero(x[i]) || Fr.zero(x[j])) return { name: p + q, s: null };

// ---------- the walk ----------

        <p>The frame is recomputed from one current turn each time, so however you turned to get there the history cancels and its fractions stay short: the tower's middle terms come down. The eye's place is a running total of strides along every heading taken, so each new heading adds to its fractions: scaffolding never taken down. At each new heading the eye is put down on the nearest point of a 1/16 grid. That is a write: it gives up only the exact path back to where you started, which no reading here uses; every reading from where you now stand stays exact.</p>`;
    }
    return h;
}
let panelTick = 0;
function updatePanel(force) {
    if (!panel.classList.contains('open')) return;
    if (!force && ++panelTick % 6) return;
    const h = panelHtml(); if (h !== lastHtml) { out.innerHTML = h; lastHtml = h; }
}
document.getElementById('menuBtn').onclick = () => { panel.classList.toggle('open'); updatePanel(true); };
const opts = { optThumbs: 'thumbs', optHeat: 'heat', optSky: 'sky', optRead: 'read', optEuler: 'euler', optOmega: 'omega', optWalk: 'walk', optChecks: 'checks', optAbout: 'about' };
{ const el = document.getElementById('optAnchor'); el.checked = S.anchor; el.onchange = () => { S.anchor = el.checked; updatePanel(true); }; }
for (const [id, k] of Object.entries(opts)) { const el = document.getElementById(id); el.checked = S.show[k];
    el.onchange = () => { S.show[k] = el.checked; updatePanel(true); }; }

// ---------- input (desktop) ----------
const keys = new Set();
addEventListener('keydown', ev => {
    const k = ev.key.toLowerCase();
    if (k === 'm') { panel.classList.toggle('open'); updatePanel(true); return; }
    if (k === 'escape') { panel.classList.remove('open'); return; }
    if (k === 'h') { S.holdH = !S.holdH; updatePanel(true); return; }
    keys.add(k); if (ev.key.startsWith('Arrow')) ev.preventDefault();
});
addEventListener('keyup', ev => keys.delete(ev.key.toLowerCase()));
let drag = null;
cv.addEventListener('mousedown', ev => { drag = [ev.clientX, ev.clientY]; });
addEventListener('mouseup', () => { drag = null; });
addEventListener('mousemove', ev => { if (!drag) return; const dx = ev.clientX - drag[0], dy = ev.clientY - drag[1]; drag = [ev.clientX, ev.clientY];
    S.dragX += dx; S.dragY += dy;   // two pixels of drag a step of 1/128 in the half-slope
    const kx = Math.trunc(S.dragX / 2), ky = Math.trunc(S.dragY / 2); S.dragX -= 2 * kx; S.dragY -= 2 * ky; turnBy(kx); tiltBy(-ky); });
cv.addEventListener('wheel', ev => { ev.preventDefault(); S.holdH = true; S.H = (S.H || 1) * Math.pow(2, ev.deltaY > 0 ? 0.25 : -0.25); updatePanel(true); }, { passive: false });
function tick() {
    const n = keys.has('shift') ? 8 : 1;
    for (const k of ['w', 'a', 's', 'd']) if (keys.has(k)) stride(k, n);
    if (keys.has('arrowleft')) turnBy(-1); if (keys.has('arrowright')) turnBy(1);
    if (keys.has('arrowup')) tiltBy(1); if (keys.has('arrowdown')) tiltBy(-1);
    frame(); updatePanel(false); requestAnimationFrame(tick);
}

// ---------- hook ----------
window.__thumbsWalk = {
    Fr, exact: () => exactOf(S.target), checks, turnBy, tiltBy, frame: () => frame(),
    // the cull at the eye now: cells scanned, things kept per level, and (C3) any thing past the scan that would qualify
    cull() { const e = S.eye.map(Fr.num), kept = thingsNear(e), res = { levels: LEVELS, below: BELOW, share: SHARE, focus: S.focus, scan: SCAN, scanned: CULL.scanned,
            perLevel: CULL.perLevel.slice(), kept: kept.length, belowGrain: kept.filter(t => !keptAt(t, e)).length };
        res.missed = thingsNear(e, 2, 1).length; thingsNear(e); return res; },
    // run the pipeline with every trigonometric function replaced by a counter; nothing in turning, projecting,
    // picking, walking or the exact checks should call one
    trigFree(steps = 200) {
        const names = ['sin', 'cos', 'tan', 'atan', 'atan2', 'asin', 'acos', 'sinh', 'cosh', 'tanh'], saved = {}, calls = {};
        for (const n of names) { saved[n] = Math[n]; calls[n] = 0; Math[n] = (...a) => { calls[n]++; return saved[n](...a); }; }
        try {
            for (let i = 0; i < steps; i++) { turnBy(i % 7 === 0 ? 3 : 0); tiltBy(i % 11 === 0 ? (i % 2 ? 1 : -1) : 0);
                stride('wasd'[i % 4], 1); frame(); exactOf(S.target); }
        } finally { for (const n of names) Math[n] = saved[n]; }
        return calls;
    }, stride, sky, skyShares, eyeDigits, anchors: () => S.anchors,
    target: () => S.target, pose,
    set(o) { if (o.q !== undefined) S.q = o.q; if (o.ky !== undefined) { S.ky = o.ky; turnBy(0); } if (o.kp !== undefined) { S.kp = o.kp; tiltBy(0); }
        if (o.eye) S.eye = o.eye.map(v => Fr.of(v)); if (o.anchor !== undefined) S.anchor = !!o.anchor; if (o.H !== undefined) { S.H = o.H; S.holdH = o.H !== null; }
        if (o.focus !== undefined) { if (o.focus !== null) S.focus = o.focus; S.holdFocus = o.focus !== null; } frame(); return this.state(); },
    state: () => ({ q: S.q, ky: S.ky, kp: S.kp, eye: S.eye.map(Fr.str), H: S.H, holdH: S.holdH,
        target: S.target ? { kind: S.target.kind, c: S.target.c } : null, walk: walkSummary() }),
};
addEventListener('resize', resize);
resize();
if (params.get('menu') === '1') { panel.classList.add('open'); }
requestAnimationFrame(tick);
</script>
