<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
    <title>Marbles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
    <!--
    play-marbles.html: a bowl of five hundred marbles (12 October 2026; Tom: "what about something a little different, a huge
    collection of marbles, say 500? would this be helpful?", then "both", to a physics test and a game). A gameplay sketch,
    standalone, one mechanic: throw a steelie into a heaped bowl of glass marbles; ten throws, as many knocked out as you can.

    The engine is MRB part 2's (plans/mrb-plan.md, run 3): marbles that touch and stay touching. Each pair is in contact
    while its readings are past the line h + v = 1 (each reads the other as v = r_b/d and is told h = r_a/d), pushed apart
    in proportion to how far past it, with a spring of its own history along the surface, capped by friction. So a heap
    can stand: every marble at rest is held by its contacts (MRB run 3: about six of them without friction, fewer with).
    The lab ran the engine with stiff contacts; the game uses softer ones (a spring of 3000 against 10⁵) to keep up,
    and steps only while something moves, as many steps a frame as fit, so a slow device plays the same throw in slow motion.

    Tap (or click) the bowl where to throw; set how hard (the slider, or pull the strip down and let go); the dashed arc is
    the throw as far as it can be seen ahead, to its first contact; past that the heap answers all at once. Drag to walk
    round the bowl, the wheel to come nearer. "chains" draws each contact as a line as bright as the push it carries: the
    weight runs through the heap in chains. Marbles that land on the felt outside the bowl count. Best kept in this
    browser only. Sound made here, as play-trick.html's.
    Links: ?n= (marbles, 20–500), ?seed= (the pour), ?p= (power 0–1), ?chains=1; for trying other bowls ?Rb=&depth=&steel=&vmax=. Test hook: window.__marbles (MARBLES,
    world, game, throwAt, arcOf, settleNow, chains, sound, heard).
    -->
    <style>
    :root { color-scheme: dark; --ground: #0c0c11; --line: rgba(255,255,255,0.12); --ink: #c8c8d0; --dim: #8a8a96;
        --bright: #e6e4ee; --gold: #d4a052 }
    * { box-sizing: border-box }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ground); color: var(--ink);
        font: 13px/1.4 'DM Mono', ui-monospace, monospace; overscroll-behavior: none }
    canvas { position: fixed; inset: 0; display: block; touch-action: none }
    #hud { position: fixed; left: 12px; top: 10px; right: 70px; pointer-events: none; color: var(--bright); white-space: pre-wrap;
        text-shadow: 0 1px 2px #000 }
    #hud .dim { color: var(--dim) }
    #hud.done { color: var(--gold) }
    #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
        justify-content: center; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: rgba(12,12,17,0.88);
        border-top: 1px solid var(--line) }
    button { font: inherit; color: var(--bright); background: #1d1d27; border: 1px solid var(--line); border-radius: 6px;
        padding: 6px 10px; cursor: pointer; touch-action: manipulation }
    button.go { border-color: var(--gold); color: var(--gold) }
    button:disabled { opacity: 0.4; cursor: default }
    label { display: flex; gap: 6px; align-items: center; color: var(--dim) }
    input[type=range] { width: 120px; accent-color: #d4a052 }
    #pull { position: fixed; right: 12px; top: 28%; height: 34%; width: 46px; border: 1px solid var(--line); border-radius: 23px;
        background: rgba(12,12,17,0.55); touch-action: none; cursor: ns-resize; overflow: hidden; user-select: none }
    #pull span { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; color: var(--dim); font-size: 12px; pointer-events: none }
    #pullfill { position: absolute; left: 0; right: 0; top: 0; height: 0; background: linear-gradient(#d4a05233, #d4a052aa) }
    @media (pointer: coarse) {
        button { padding: 10px 14px; min-height: 44px }
        input[type=range] { width: 150px; height: 32px }
        #pull { width: 56px; border-radius: 28px }
    }
    @media (max-width: 760px) {
        html, body { font-size: 11.5px }
        #bar { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; scrollbar-width: none }
        #bar::-webkit-scrollbar { display: none }
        #bar > * { flex: none }
        #pull { width: 34px; right: 3px; border-radius: 17px }
        #pull span { font-size: 10px }
    }
    </style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"></div>
<div id="bar">
    <button id="throw" class="go">throw</button>
    <label>how hard <input id="power" type="range" min="1" max="10" step="0.1" value="5.5"></label>
    <button id="left" aria-label="walk left">◀</button>
    <button id="right" aria-label="walk right">▶</button>
    <button id="chains">chains: off</button>
    <button id="again">new bowl</button>
    <button id="sound" aria-label="sound on or off">sound: on</button>
    <button id="full" aria-label="full screen">⛶</button>
</div>
<div id="pull" role="slider" aria-label="pull down and let go to throw" aria-valuemin="0" aria-valuemax="1"><div id="pullfill"></div><span>pull</span></div>
<script>
(() => {
    // ══ the engine: marbles that touch and stay touching (MRB part 2, plans/mrb-plan.md) ══
    // Units: a marble's diameter 1, its mass 1, gravity 1 (so time is in √(σ/g), 40 ms for a 16 mm marble).
    // A pair is in contact while its readings are past the line: each marble reads the other as v = r_b/d and is told
    // h = r_a/d, and they touch while h + v > 1. How far past the line, in the marble's own radius, is the depth of the
    // contact, (h + v − 1)/h, and the push is in proportion to it (a spring, with a dashpot for the restitution e). Along
    // the surface each contact keeps a spring of its own history, capped by Coulomb's friction (Cundall and Strack's), so a
    // marble at rest can lean on its neighbours. Containers are surfaces with the same contact law: a floor, square walls,
    // a bowl (the inside of a sphere, up to its rim, on a table), or sides that wrap round (periodic).
    const MARBLES = (() => {
        const R = 0.5, SQ = x => x * x;
        const restCoef = e => e >= 1 ? 0 : 2 * -Math.log(e) / Math.sqrt(Math.PI * Math.PI + Math.log(e) ** 2);   // γ = c·√(m_eff·k)
        function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

        // o: { N, kn, e, mu, muW (surfaces' friction), eW, muR (rolling resistance on surfaces), skin, dt,
        //      box: { kind: 'periodic' | 'silo', W } | { kind: 'bowl', Rb, depth } }
        function World(o) {
            const N = o.N, kn = o.kn, kt = 2 / 7 * kn, mu = o.mu, muW = o.muW ?? o.mu, muR = o.muR || 0, g = o.g ?? 1, box = o.box;
            const skin = o.skin ?? 0.2, per = box.kind === 'periodic', bowl = box.kind === 'bowl', silo = box.kind === 'silo';
            const L = per ? box.W : 0, W = box.W || 0, NS = bowl ? 2 : 5;
            let cn = restCoef(o.e), cW = restCoef(o.eW ?? o.e);
            const meff1 = 0.5, gam1 = cn * Math.sqrt(meff1 * kn), tc = Math.PI / Math.sqrt(kn / meff1 - SQ(gam1 / (2 * meff1))), dt = o.dt ?? tc / 25;
            const A = () => new Float64Array(N);
            const x = A(), y = A(), z = A(), vx = A(), vy = A(), vz = A(), wx = A(), wy = A(), wz = A();
            const fx = A(), fy = A(), fz = A(), tx = A(), ty = A(), tz = A(), m = A().fill(1), x0 = A(), y0 = A(), z0 = A();
            const on = new Uint8Array(N).fill(1);
            let cap = 8 * N, np = 0, PI = new Int32Array(cap), PJ = new Int32Array(cap), PH = new Float64Array(3 * cap), FN = new Float64Array(cap);
            const SH = new Float64Array(3 * N * NS), SF = new Float64Array(N * NS);   // each marble's tangential history and push on each surface
            const load = { floor: 0, walls: 0, bowl: 0, table: 0 };                  // the upward force each kind of surface gave, last step
            const Rb = box.Rb || 0, depth = box.depth || 0, rim = bowl ? Math.sqrt(Rb * Rb - SQ(Rb - depth)) : 0;
            let rebuild = true, t = 0, steps = 0, events = null;
            const lastF = [0, 0, 0];

            function build() {
                const cs = 1 + skin, old = new Map();
                for (let k = 0; k < np; k++) if (FN[k] > 0) old.set(PI[k] * N + PJ[k], k);   // pairs in contact keep their history
                const oPH = PH.slice(0, 3 * np), oFN = FN.slice(0, np);
                const M = per ? Math.max(3, Math.floor(L / cs)) : 0, csx = per ? L / M : cs;
                const CX = new Int32Array(N), CY = new Int32Array(N), CZ = new Int32Array(N), H = 4093, head = new Int32Array(H).fill(-1), next = new Int32Array(N);
                const hash = (a, b, c) => (((a * 73856093) ^ (b * 19349663) ^ (c * 83492791)) >>> 0) % H;
                for (let i = 0; i < N; i++) {
                    if (!on[i]) continue;
                    let a = Math.floor(x[i] / csx), b = Math.floor(y[i] / csx); const c = Math.floor(z[i] / cs);
                    if (per) { a = ((a % M) + M) % M; b = ((b % M) + M) % M; }
                    CX[i] = a; CY[i] = b; CZ[i] = c; const h = hash(a, b, c); next[i] = head[h]; head[h] = i;
                    x0[i] = x[i]; y0[i] = y[i]; z0[i] = z[i];
                }
                np = 0; const lim = cs * cs;
                for (let i = 0; i < N; i++) {
                    if (!on[i]) continue;
                    for (let da = -1; da <= 1; da++) for (let db = -1; db <= 1; db++) for (let dc = -1; dc <= 1; dc++) {
                        let a = CX[i] + da, b = CY[i] + db; const c = CZ[i] + dc;
                        if (per) { a = (a + M) % M; b = (b + M) % M; }
                        for (let j = head[hash(a, b, c)]; j >= 0; j = next[j]) {
                            if (j <= i || CX[j] !== a || CY[j] !== b || CZ[j] !== c) continue;
                            let dx = x[i] - x[j], dy = y[i] - y[j]; const dz = z[i] - z[j];
                            if (per) { dx -= L * Math.round(dx / L); dy -= L * Math.round(dy / L); }
                            if (dx * dx + dy * dy + dz * dz >= lim) continue;
                            if (np === cap) { cap *= 2; let T = new Int32Array(cap); T.set(PI); PI = T; T = new Int32Array(cap); T.set(PJ); PJ = T;
                                let U = new Float64Array(cap); U.set(FN); FN = U; U = new Float64Array(3 * cap); U.set(PH); PH = U; }
                            PI[np] = i; PJ[np] = j; const q = old.get(i * N + j);
                            if (q !== undefined) { PH[3 * np] = oPH[3 * q]; PH[3 * np + 1] = oPH[3 * q + 1]; PH[3 * np + 2] = oPH[3 * q + 2]; FN[np] = oFN[q]; }
                            else { PH[3 * np] = 0; PH[3 * np + 1] = 0; PH[3 * np + 2] = 0; FN[np] = 0; }
                            np++;
                        }
                    }
                }
                rebuild = false;
            }

            // one contact's push on i, from j (j ≥ 0) or a surface (j < 0): n from the other to i, depth del; the history
            // H[k3..k3+2]; writes the forces and torques, and lastF; returns the normal push
            function contact(i, j, nx, ny, nz, del, H, k3, mu_, c, rr) {
                const mi = m[i], me = j >= 0 ? mi * m[j] / (mi + m[j]) : mi;
                // the contact point's relative velocity: (v_i − v_j) − R (ω_i + ω_j) × n
                let sx = wx[i], sy = wy[i], sz = wz[i], rvx = vx[i], rvy = vy[i], rvz = vz[i];
                if (j >= 0) { sx += wx[j]; sy += wy[j]; sz += wz[j]; rvx -= vx[j]; rvy -= vy[j]; rvz -= vz[j]; }
                rvx -= R * (sy * nz - sz * ny); rvy -= R * (sz * nx - sx * nz); rvz -= R * (sx * ny - sy * nx);
                const vn = rvx * nx + rvy * ny + rvz * nz, tvx = rvx - vn * nx, tvy = rvy - vn * ny, tvz = rvz - vn * nz;
                const gam = c * Math.sqrt(me * kn);
                let fn = kn * del - gam * vn; if (fn < 0) fn = 0;
                // the tangential spring: kept in the plane of contact, stretched by the slip, capped by friction
                let hx = H[k3], hy = H[k3 + 1], hz = H[k3 + 2]; const hn = hx * nx + hy * ny + hz * nz;
                hx += tvx * dt - hn * nx; hy += tvy * dt - hn * ny; hz += tvz * dt - hn * nz;
                const gt = 2 / 7 * gam; let ftx = -kt * hx - gt * tvx, fty = -kt * hy - gt * tvy, ftz = -kt * hz - gt * tvz;
                const ft2 = ftx * ftx + fty * fty + ftz * ftz, capF = mu_ * fn;
                if (ft2 > capF * capF) {
                    const s = ft2 > 0 ? capF / Math.sqrt(ft2) : 0; ftx *= s; fty *= s; ftz *= s;
                    hx = -(ftx + gt * tvx) / kt; hy = -(fty + gt * tvy) / kt; hz = -(ftz + gt * tvz) / kt;
                }
                H[k3] = hx; H[k3 + 1] = hy; H[k3 + 2] = hz;
                const Fx = fn * nx + ftx, Fy = fn * ny + fty, Fz = fn * nz + ftz;
                // both spins turn the same way: τ = −R n × F_t
                const qx = -R * (ny * ftz - nz * fty), qy = -R * (nz * ftx - nx * ftz), qz = -R * (nx * fty - ny * ftx);
                fx[i] += Fx; fy[i] += Fy; fz[i] += Fz; tx[i] += qx; ty[i] += qy; tz[i] += qz;
                if (j >= 0) { fx[j] -= Fx; fy[j] -= Fy; fz[j] -= Fz; tx[j] += qx; ty[j] += qy; tz[j] += qz; }
                else if (rr > 0 && fn > 0) {
                    // rolling resistance on a surface: a torque against the spin across n, no more than stops it this step
                    const ox = wx[i], oy = wy[i], oz = wz[i], on_ = ox * nx + oy * ny + oz * nz, px = ox - on_ * nx, py = oy - on_ * ny, pz = oz - on_ * nz;
                    const pw = Math.sqrt(px * px + py * py + pz * pz);
                    if (pw > 0) { const I = 0.4 * mi * R * R, tq = Math.min(rr * R * fn, pw * I / dt) / pw; tx[i] -= tq * px; ty[i] -= tq * py; tz[i] -= tq * pz; }
                }
                lastF[0] = Fx; lastF[1] = Fy; lastF[2] = Fz;
                return fn;
            }
            // marble i against surface s
            function surf(i, s, nx, ny, nz, del) {
                const k = i * NS + s;
                if (del <= 0) { if (SF[k] !== 0 || SH[3 * k] !== 0) { SH[3 * k] = 0; SH[3 * k + 1] = 0; SH[3 * k + 2] = 0; SF[k] = 0; } return 0; }
                const was = SF[k] > 0, fn = contact(i, -1, nx, ny, nz, del, SH, 3 * k, muW, cW, muR);
                if (!was && events && fn > 0) events.push({ t, i, j: -1 - s, w: -(vx[i] * nx + vy[i] * ny + vz[i] * nz) });
                SF[k] = fn; return lastF[2];
            }
            function surfaces() {
                load.floor = 0; load.walls = 0; load.bowl = 0; load.table = 0;
                if (bowl) {
                    for (let i = 0; i < N; i++) {
                        if (!on[i]) continue;
                        const dx = x[i], dy = y[i], dz = z[i] - Rb, d = Math.sqrt(dx * dx + dy * dy + dz * dz), rho = Math.sqrt(dx * dx + dy * dy);
                        // the bowl from inside (the touching point below the rim), its outside, or the rim's edge (a circle)
                        if (d > Rb - R && d < Rb && z[i] + R * dz / d < depth) load.bowl += surf(i, 0, -dx / d, -dy / d, -dz / d, d - (Rb - R));
                        else if (d >= Rb && d < Rb + R && z[i] < depth) load.bowl += surf(i, 0, dx / d, dy / d, dz / d, Rb + R - d);
                        else {
                            const ex = rho > 1e-9 ? dx / rho * rim : rim, ey = rho > 1e-9 ? dy / rho * rim : 0, qx = dx - ex, qy = dy - ey, qz = z[i] - depth, q = Math.sqrt(qx * qx + qy * qy + qz * qz);
                            load.bowl += q < R && q > 1e-9 ? surf(i, 0, qx / q, qy / q, qz / q, R - q) : surf(i, 0, 0, 0, 1, -1);
                        }
                        // the table, outside the bowl's sphere (a marble already below it is not pushed back up through it)
                        load.table += surf(i, 1, 0, 0, 1, (d >= Rb || rho > rim) && z[i] > 0 ? R - z[i] : -1);
                    }
                    return;
                }
                for (let i = 0; i < N; i++) {
                    if (!on[i]) continue;
                    load.floor += surf(i, 0, 0, 0, 1, R - z[i]);
                    if (silo) load.walls += surf(i, 1, 1, 0, 0, R - x[i]) + surf(i, 2, -1, 0, 0, x[i] - (W - R)) + surf(i, 3, 0, 1, 0, R - y[i]) + surf(i, 4, 0, -1, 0, y[i] - (W - R));
                }
            }

            function step() {
                if (rebuild) build();
                for (let i = 0; i < N; i++) { fx[i] = 0; fy[i] = 0; fz[i] = on[i] ? -m[i] * g : 0; tx[i] = 0; ty[i] = 0; tz[i] = 0; }
                // pairs: in contact while h + v > 1. Marble i reading j (both of radius ½): v = ½/d, told h = ½/d, so h + v = 1/d,
                // and the depth past the line in diameters is d·(h + v − 1) = 1 − d.
                for (let k = 0; k < np; k++) {
                    const i = PI[k], j = PJ[k];
                    let dx = x[i] - x[j], dy = y[i] - y[j]; const dz = z[i] - z[j];
                    if (per) { dx -= L * Math.round(dx / L); dy -= L * Math.round(dy / L); }
                    const d2 = dx * dx + dy * dy + dz * dz;
                    if (d2 >= 1) { if (FN[k] !== 0) { PH[3 * k] = 0; PH[3 * k + 1] = 0; PH[3 * k + 2] = 0; FN[k] = 0; } continue; }
                    const d = Math.sqrt(d2), hv = 1 / d, was = FN[k] > 0;
                    const fn = contact(i, j, dx / d, dy / d, dz / d, d * (hv - 1), PH, 3 * k, mu, cn, 0);
                    if (!was && events && fn > 0) events.push({ t, i, j, w: -((vx[i] - vx[j]) * dx + (vy[i] - vy[j]) * dy + (vz[i] - vz[j]) * dz) / d });
                    FN[k] = fn > 0 ? fn : 1e-300;   // in contact with no push (pulling apart) still counts as touching
                }
                surfaces();
                // move: symplectic Euler
                let moved = 0;
                for (let i = 0; i < N; i++) {
                    if (!on[i]) continue;
                    const im = dt / m[i], iI = dt / (0.4 * m[i] * R * R);
                    vx[i] += fx[i] * im; vy[i] += fy[i] * im; vz[i] += fz[i] * im;
                    wx[i] += tx[i] * iI; wy[i] += ty[i] * iI; wz[i] += tz[i] * iI;
                    x[i] += vx[i] * dt; y[i] += vy[i] * dt; z[i] += vz[i] * dt;
                    const m2 = SQ(x[i] - x0[i]) + SQ(y[i] - y0[i]) + SQ(z[i] - z0[i]); if (m2 > moved) moved = m2;
                }
                if (per) for (let i = 0; i < N; i++) {   // keep positions in the box (the neighbour list reads the nearest image)
                    if (x[i] < 0 || x[i] >= L) { const s = Math.floor(x[i] / L) * L; x[i] -= s; x0[i] -= s; }
                    if (y[i] < 0 || y[i] >= L) { const s = Math.floor(y[i] / L) * L; y[i] -= s; y0[i] -= s; }
                }
                if (moved > SQ(skin / 2)) rebuild = true;
                t += dt; steps++;
            }

            const w = {
                N, R, box, dt, tc, kn, mu, muW, x, y, z, vx, vy, vz, wx, wy, wz, m, on, load, rim,
                get t() { return t; }, get steps() { return steps; }, get np() { return np; },
                get events() { return events; }, set events(v) { events = v; },
                step, stepN(n) { for (let k = 0; k < n; k++) step(); },
                touch() { rebuild = true; },   // after moving marbles by hand, or turning one on or off
                restitution(e, eW = e) { cn = restCoef(e); cW = restCoef(eW); },
                pairs() { return { np, PI, PJ, FN }; },   // the neighbour list and each pair's push (for drawing the chains)
                maxSpeed(touching = false) {
                    // touching: leave out the marbles that rest on the container alone, touching no other marble
                    let skip = null;
                    if (touching) {
                        skip = new Uint8Array(N); for (let i = 0; i < N; i++) for (let q = 0; q < NS; q++) if (SF[i * NS + q] > 0) skip[i] = 1;
                        for (let k = 0; k < np; k++) if (FN[k] > 0) { skip[PI[k]] = 0; skip[PJ[k]] = 0; }
                    }
                    let s = 0; for (let i = 0; i < N; i++) if (on[i] && !(skip && skip[i])) { const v = vx[i] * vx[i] + vy[i] * vy[i] + vz[i] * vz[i]; if (v > s) s = v; }
                    return Math.sqrt(s);
                },
                weight() { let s = 0; for (let i = 0; i < N; i++) if (on[i]) s += m[i] * g; return s; },
                // run until no marble moves faster than v (checked every `every` steps), or the clock reaches tmax
                // (MRB run 3's rule: a marble resting on the container alone, touching no other marble, is a rattler, which on
                // a floor with no rolling resistance may roll in its cage for ever, and is left out)
                settle(v = 1e-4, tmax = 400, every = 100, touching = true) { while (t < tmax) { for (let k = 0; k < every; k++) step(); if (w.maxSpeed(touching) < v) return true; } return false; },
                // the contacts in force (h + v > 1) between marbles: [i, j, push]
                contacts() { const out = []; for (let k = 0; k < np; k++) if (FN[k] > 0) out.push([PI[k], PJ[k], FN[k] > 1e-200 ? FN[k] : 0]); return out; },
                surfaceContacts() { const out = []; for (let i = 0; i < N; i++) for (let s = 0; s < NS; s++) if (SF[i * NS + s] > 0) out.push([i, s, SF[i * NS + s]]); return out; },
                // Z: rattlers (fewer than minC contacts) removed until none is left; the mean count of the rest with centres in [za, zb]
                coordination(za, zb, minC = 4) {
                    const cs = w.contacts(), alive = new Uint8Array(N).fill(1), cnt = new Int32Array(N);
                    for (;;) {

        // the aim: the arc to its first contact (all that can be seen ahead), the target
        if (game.state === 'aim' && game.target) {
            const { pts, reach } = arcOf(game.target, game.power), q = pts.map(project).filter(p => p[2] > 0.5);
            ctx.setLineDash([5, 6]); ctx.strokeStyle = reach ? 'rgba(212,160,82,0.9)' : 'rgba(200,90,80,0.9)'; ctx.lineWidth = 2; path(q); ctx.stroke(); ctx.setLineDash([]);
            const [tx, ty, tz] = project(game.target); ctx.strokeStyle = '#d4a052'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(tx, ty, Math.max(6, view.F * 0.6 / tz), 0, TAU); ctx.stroke();
            const h = project(hand()); ctx.drawImage(sprite('steel', 2), h[0] - view.F * 0.5 / h[2], h[1] - view.F * 0.5 / h[2], view.F / h[2], view.F / h[2]);
        }
        hud();
    }
    function hud() {
        const left = THROWS - game.throws, inBowl = (() => { let n = 0; for (let i = 0; i < NM; i++) if (W.on[i] && !game.out[i]) n++; return n; })();
        const head = game.state === 'pour' ? 'pouring the marbles…'
            : game.state === 'done' ? `done: ${game.outs} knocked out in ${THROWS} throws` + (game.best ? `  (best ${Math.max(game.best, game.outs)})` : '')
            : game.state === 'live' ? `throw ${game.throws}: ${game.thisThrow} out…`
            : `throw ${game.throws + 1} of ${THROWS}` + (game.target ? '' : ': tap the bowl where to throw');
        $('hud').innerHTML = `${head}\n<span class="dim">${inBowl} in the bowl · out ${game.outs}${game.log.length ? ' (' + game.log.join(' ') + ')' : ''}${game.best && game.state !== 'done' ? ' · best ' + game.best : ''}</span>`;
        $('throw').disabled = game.state !== 'aim' || !game.target;
    }

    // ══ controls ══
    let drag = null;
    cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, az: cam.az, el: cam.el, moved: false }; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointermove', e => {
        if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        if (Math.hypot(dx, dy) > 6) drag.moved = true;
        if (drag.moved) { cam.az = drag.az - dx * 0.008; cam.el = Math.max(12 * D, Math.min(80 * D, drag.el + dy * 0.006)); dirty = true; }
    });
    cv.addEventListener('pointerup', e => {
        if (drag && !drag.moved && (game.state === 'aim')) { B = basis(); const p = pick(e.clientX, e.clientY); if (p) { game.target = p; dirty = true; } }
        drag = null;
    });
    cv.addEventListener('wheel', e => { e.preventDefault(); cam.dist = Math.max(16, Math.min(70, cam.dist * Math.exp(e.deltaY * 0.001))); dirty = true; }, { passive: false });
    $('throw').onclick = () => { audio(); if (game.target) throwAt(game.target, game.power); };
    $('power').oninput = e => { game.power = (+e.target.value - 1) / 9; dirty = true; };
    $('left').onclick = () => { cam.az -= 15 * D; dirty = true; };
    $('right').onclick = () => { cam.az += 15 * D; dirty = true; };
    $('chains').onclick = () => { showChains = !showChains; $('chains').textContent = 'chains: ' + (showChains ? 'on' : 'off'); dirty = true; };
    $('again').onclick = () => { newBowl(); dirty = true; };
    $('sound').onclick = () => { soundOn = !soundOn; try { localStorage.setItem('wander.marbles.sound', soundOn ? 'on' : 'off'); } catch (e) { /* this visit */ } $('sound').textContent = 'sound: ' + (soundOn ? 'on' : 'off'); if (soundOn) audio(); };
    $('full').onclick = () => { const d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(() => {}); else if (document.exitFullscreen) document.exitFullscreen().catch(() => {}); };
    window.addEventListener('keydown', e => {
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); audio(); if (game.target) throwAt(game.target, game.power); }
        else if (e.key === 'ArrowLeft') { cam.az -= 5 * D; dirty = true; } else if (e.key === 'ArrowRight') { cam.az += 5 * D; dirty = true; }
        else if (e.key === 'c') $('chains').onclick();
    });
    // pull and let go (as play-trick.html): drag down the strip, as hard as far, and let go to throw at the target
    { const pull = $('pull'), fill = $('pullfill'); let p0 = null;
      const frac = e => { const r = pull.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientY - r.top) / r.height)); };
      pull.addEventListener('pointerdown', e => { if (game.state !== 'aim' || !game.target) return; audio(); p0 = game.power; pull.setPointerCapture(e.pointerId); const f = frac(e); fill.style.height = f * 100 + '%'; });
      pull.addEventListener('pointermove', e => { if (p0 == null) return; const f = frac(e); fill.style.height = f * 100 + '%'; game.power = f; $('power').value = 1 + 9 * f; dirty = true; });
      pull.addEventListener('pointerup', e => { if (p0 == null) return; const f = frac(e); fill.style.height = '0'; if (f > 0.05) { game.power = f; throwAt(game.target, f); } else game.power = p0; p0 = null; dirty = true; });
    }

    let lastT = performance.now();
    function frame(now) {
        const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
        if (game.state === 'pour' || game.state === 'live') { advance(12, dt / 0.04); soundsNow(); dirty = true; }
        if (dirty) { draw(); dirty = false; }
        requestAnimationFrame(frame);
    }
    window.addEventListener('resize', layoutView);
    newBowl(); layoutView();
    $('chains').textContent = 'chains: ' + (showChains ? 'on' : 'off'); $('sound').textContent = 'sound: ' + (soundOn ? 'on' : 'off');
    if (Q.get('p')) { game.power = Math.max(0, Math.min(1, +Q.get('p'))); $('power').value = 1 + 9 * game.power; }
    requestAnimationFrame(frame);

    // test hook: the engine, and the game driven without the screen (step until quiet, throw at a point)
    window.__marbles = {
        MARBLES, get world() { return W; }, get game() { return game; }, heard, throwAt, arcOf, launch, NM, THROWS,
        // run the bowl until it is quiet, as the page would, however long the steps take
        settleNow(maxUnits = 200) { const t0 = W.t; while ((game.state === 'pour' || game.state === 'live') && W.t - t0 < maxUnits) { advance(1e9, 0.5); soundsNow(); } dirty = true; return game.state; },
        chains(on) { showChains = on; dirty = true; },
        sound(on) { if (on != null) { soundOn = on; } return soundOn; },
    };
})();
</script>
</body>
</html>
