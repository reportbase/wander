<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Aim from the cue ball</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Serif+Display&display=swap">
    <!--
    play-corner.html: aim from the cue ball (10 October 2026; Tom: "we are exploring game play here that uses situated
    math. situated math uses horizons, corners, LOD. much differently"; "situated is much better at certain things").
    A gameplay sketch, standalone, one mechanic: aiming a cut from the cue ball's own view, in the object ball's own size.

    The cue ball reads the object ball's half-span, sin α = v = r/d. It aims a fraction f of that off the ball's middle:
    sin δ = f·v. The line of centres at contact then makes the cut φ with the cue's line, sin φ = d·sin δ/(2r) = f/2.
    The distance cancels: aimed in the object ball's own size, a shot is the same shot at any distance. f = 0 is full,
    f = 1 (aim at the edge) is the half-ball hit, 30° at any distance, and f = 2 the graze, 90°: the ghost ball touching the
    object ball at its edge, h + v = 1 with equal balls (the corner, h = v = ½). This is the ghost-ball method players use.
    The view is drawn in the object ball's own size, so it looks the same whatever the distance; only the ghost ball
    (the cue ball where it will touch, nearer) reads a little larger near.
    Links: ?seed=, ?d= (the cue ball's distance, the same shot). Test hook: window.__corner.
    -->
    <style>
    :root { color-scheme: dark; --ground: #0c0c11; --panel: #14141b; --line: rgba(255,255,255,0.09); --ink: #c8c8d0;
        --dim: #8a8a96; --bright: #e6e4ee; --gold: #d4a052; --teal: #8ce6cd; --red: #d96e5b }
    * { box-sizing: border-box }
    body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.5 'DM Mono', ui-monospace, monospace }
    main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px }
    h1 { font: 400 32px/1.1 'DM Serif Display', Georgia, serif; color: var(--bright); margin: 0 0 6px }
    .lede { color: var(--dim); margin: 0 0 14px; max-width: 72ch }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 0 0 14px }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
    button { max-width: 100%; font: inherit; color: var(--bright); background: #1d1d27; border: 1px solid var(--line);
        border-radius: 6px; padding: 6px 10px; cursor: pointer; touch-action: manipulation }
    button.on { border-color: var(--gold); color: var(--gold) }
    canvas { width: 100%; display: block; border-radius: 6px; background: #000; touch-action: none }
    #hud { white-space: pre-wrap; color: var(--bright); font-size: 12.5px; margin-top: 8px }
    .note { color: var(--dim); font-size: 12.5px }
    a { color: var(--teal) }
    </style>
</head>
<body>
<main>
    <h1>Aim from the cue ball</h1>
    <p class="lede">Pot the red. Aim only in the cue ball's view, by dragging across the red: aim at its edge for a
    half-ball hit, 30° at any distance.</p>
    <div class="panel">
        <div class="row">
            <button id="shoot">shoot</button>
            <button id="next">next table</button>
            <button id="far">same shot, farther</button>
            <button id="near">nearer</button>
        </div>
        <canvas id="view" height="220" style="margin-top:10px"></canvas>
        <canvas id="table" height="300" data-aspect="0.5" style="margin-top:10px"></canvas>
        <div id="hud"></div>
    </div>
    <p class="note">Behind it: <a href="facing.html">the line h + v = 1 and the corner</a>, <a href="pool.html">pool from
    inside</a>, <a href="demos.html">all the demos</a>.</p>
</main>
<script>
(() => {
    const $ = id => document.getElementById(id), TAU = 2 * Math.PI, D = Math.PI / 180;
    const LX = 20, LZ = 10, R = 0.45, POCK = 0.85;
    const POCKETS = [[-LX / 2, -LZ / 2], [0, -LZ / 2], [LX / 2, -LZ / 2], [-LX / 2, LZ / 2], [0, LZ / 2], [LX / 2, LZ / 2]];
    const q = new URLSearchParams(location.search);
    let seed = +(q.get('seed') || 1);

    // ══ the shot, from the cue ball ══
    // C the cue ball, O the red, f the aim in the red's own half-spans. Returns the contact and both departures.
    function shot(C, O, f) {
        const dx = O[0] - C[0], dz = O[1] - C[1], d = Math.hypot(dx, dz), v = R / d, a = Math.atan2(dz, dx);
        const s1 = f * v; if (Math.abs(s1) >= 1) return { d, v, miss: true };
        const del = Math.asin(s1), u = [Math.cos(a + del), Math.sin(a + del)], b = d * Math.sin(del);   // b: the red's offset off the cue's line
        if (Math.abs(b) >= 2 * R) return { d, v, miss: true, u };
        const s = d * Math.cos(del) - Math.sqrt(4 * R * R - b * b), G = [C[0] + s * u[0], C[1] + s * u[1]];   // the ghost ball: the cue ball touching
        const n = [(O[0] - G[0]) / (2 * R), (O[1] - G[1]) / (2 * R)], un = u[0] * n[0] + u[1] * n[1];
        const t = [u[0] - un * n[0], u[1] - un * n[1]], tl = Math.hypot(...t) || 1;
        const phi = Math.atan2(u[0] * n[1] - u[1] * n[0], un);   // the cut: from the cue's line to the line of centres
        return { d, v, u, s, G, n, t: [t[0] / tl, t[1] / tl], phi, ghostV: R / s };
    }
    // where a ball leaving P along n meets the table's edge, and the pocket it drops in there (if any)
    function exitOf(P, n) {
        let best = Infinity;
        if (n[0]) for (const X of [-LX / 2, LX / 2]) { const k = (X - P[0]) / n[0]; if (k > 1e-9) best = Math.min(best, k); }
        if (n[1]) for (const Z of [-LZ / 2, LZ / 2]) { const k = (Z - P[1]) / n[1]; if (k > 1e-9) best = Math.min(best, k); }
        const E = [P[0] + best * n[0], P[1] + best * n[1]];
        const pk = POCKETS.findIndex(p => Math.hypot(p[0] - E[0], p[1] - E[1]) < POCK);
        return { E, pocket: pk };
    }

    // ══ a table: the red, a pocket for it, and the cue ball placed for a cut between −60° and 60° ══
    function layout(sd) {
        let a = sd >>> 0; const rnd = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
        for (let tries = 0; tries < 500; tries++) {
            const O = [-LX / 2 + 2 + rnd() * (LX - 4), -LZ / 2 + 1.5 + rnd() * (LZ - 3)], P = POCKETS[Math.floor(rnd() * 6)];
            const toP = [P[0] - O[0], P[1] - O[1]], lp = Math.hypot(...toP); if (lp < 2.5) continue;
            const nP = [toP[0] / lp, toP[1] / lp], phi = (rnd() * 120 - 60) * D, d = 3 + rnd() * 7;
            const C = place(O, nP, phi, d); if (!C) continue;
            if (exitOf(O, nP).pocket < 0) continue;
            return { C, O, P, nP, phi, d };
        }
        return null;
    }
    // the cue ball at distance d from the red, coming in at the cut phi: the ghost ball sits 2R behind the red along nP
    function place(O, nP, phi, d) {
        const G = [O[0] - 2 * R * nP[0], O[1] - 2 * R * nP[1]], a = Math.atan2(nP[1], nP[0]) - phi, u = [Math.cos(a), Math.sin(a)];
        const back = Math.sqrt(Math.max(0, d * d - (2 * R * Math.sin(phi)) ** 2)) - 2 * R * Math.cos(phi);   // so that |O − C| = d
        const C = [G[0] - back * u[0], G[1] - back * u[1]];
        return Math.abs(C[0]) > LX / 2 - 0.8 || Math.abs(C[1]) > LZ / 2 - 0.8 ? null : C;
    }
    const cutOf = (f, d) => { const r = shot([0, 0], [d, 0], f); return r.miss ? null : r.phi / D; };   // in degrees
    const fFor = phi => -2 * Math.sin(phi);   // the aim, in the red's half-spans, for a cut phi (aim right of its middle, it goes left)

    // ══ the page ══
    let L = null, f = 0, anim = null, potted = 0, shots = 0, result = '';
    function newTable() { L = layout(seed); f = 0; anim = null; result = ''; if (L && q.get('d')) setD(+q.get('d')); draw(); }
    // the same shot from another distance: the cue ball slides along its line; the view does not change
    function setD(nd) { const C = place(L.O, L.nP, L.phi, nd); if (C) { L = { ...L, C, d: nd }; anim = null; result = ''; } return !!C; }
    function fit(cv) {
        const dpr = Math.min(2, window.devicePixelRatio || 1), w = cv.clientWidth;
        if (cv.dataset.aspect) cv.dataset.h = Math.round(Math.min(w * +cv.dataset.aspect, 420));
        const hh = +(cv.dataset.h || (cv.dataset.h = cv.getAttribute('height')));
        cv.style.height = hh + 'px';
        if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(hh * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(hh * dpr); }
        const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); return [g, w, hh];
    }
    let viewMap = null;
    function draw() {
        if (!L) return;
        const S = shot(L.C, L.O, f);
        // ── the cue ball's view, in the red's own size: the red always the same width, whatever the distance ──
        let [g, W, H] = fit($('view'));
        g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
        const unit = Math.min(W / 6.2, H * 0.32), cx = W / 2, cy = H * 0.46; viewMap = { unit, cx };
        g.fillStyle = '#16513f'; g.fillRect(0, cy + unit * 0.55, W, H);   // the cloth, below the balls' middles
        g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = 1;
        for (const k of [-2, -1, -0.5, 0, 0.5, 1, 2]) {
            const x = cx + k * unit; g.beginPath(); g.moveTo(x, H - 26); g.lineTo(x, H - 18); g.stroke();
            g.fillStyle = '#8a8a96'; g.font = '11px DM Mono, monospace'; g.textAlign = 'center';
            g.fillText(k === 0.5 ? '½' : k === -0.5 ? '½' : String(Math.abs(k)), x, H - 6);
        }
        g.fillStyle = '#d23a2f'; g.beginPath(); g.arc(cx, cy, unit, 0, TAU); g.fill();   // the red, one half-span = one unit
        if (!S.miss) {   // the ghost ball: the cue ball where it will touch, read at its own (nearer) distance
            const gr = unit * S.ghostV / S.v; g.strokeStyle = 'rgba(242,240,234,0.8)'; g.setLineDash([5, 4]); g.lineWidth = 1.5;
            g.beginPath(); g.arc(cx + f * unit, cy, gr, 0, TAU); g.stroke(); g.setLineDash([]);
        }
        g.strokeStyle = S.miss ? '#d96e5b' : '#d4a052'; g.lineWidth = 2;
        g.beginPath(); g.moveTo(cx + f * unit, 8); g.lineTo(cx + f * unit, H - 30); g.stroke();
        g.textAlign = 'left';

        // ── the table from above: where things are; the aim is not drawn until the shot ──
        [g, W, H] = fit($('table'));
        g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
        const sc = Math.min((W - 20) / (LX + 1.6), (H - 20) / (LZ + 1.6)), ox = W / 2, oy = H / 2, P = (x, z) => [ox + x * sc, oy + z * sc];
        g.fillStyle = '#2a1a12'; g.fillRect(ox - (LX / 2 + 0.8) * sc, oy - (LZ / 2 + 0.8) * sc, (LX + 1.6) * sc, (LZ + 1.6) * sc);
        g.fillStyle = '#16513f'; g.fillRect(ox - LX / 2 * sc, oy - LZ / 2 * sc, LX * sc, LZ * sc);
        POCKETS.forEach(([px, pz], k) => { g.fillStyle = '#060608'; g.beginPath(); g.arc(...P(px, pz), POCK * sc, 0, TAU); g.fill();
            if (px === L.P[0] && pz === L.P[1]) { g.strokeStyle = '#d4a052'; g.lineWidth = 2; g.beginPath(); g.arc(...P(px, pz), POCK * sc + 3, 0, TAU); g.stroke(); } });
        let cue = L.C, red = L.O;
        if (anim) {
            const k = anim.k;
            g.strokeStyle = 'rgba(242,240,234,0.35)'; g.lineWidth = 1; g.setLineDash([4, 4]);
            if (anim.S.miss) { g.beginPath(); g.moveTo(...P(...L.C)); g.lineTo(...P(L.C[0] + anim.S.u[0] * 30, L.C[1] + anim.S.u[1] * 30)); g.stroke(); }
            else { g.beginPath(); g.moveTo(...P(...L.C)); g.lineTo(...P(...anim.S.G)); g.lineTo(...P(anim.S.G[0] + anim.S.t[0] * 3, anim.S.G[1] + anim.S.t[1] * 3)); g.stroke();
                g.strokeStyle = 'rgba(217,110,91,0.6)'; g.beginPath(); g.moveTo(...P(...L.O)); g.lineTo(...P(...anim.X.E)); g.stroke(); }
            g.setLineDash([]);
            if (anim.S.miss) cue = [L.C[0] + anim.S.u[0] * k * 8, L.C[1] + anim.S.u[1] * k * 8];
            else if (k < 0.5) { const w = k / 0.5; cue = [L.C[0] + (anim.S.G[0] - L.C[0]) * w, L.C[1] + (anim.S.G[1] - L.C[1]) * w]; }
            else { const w = (k - 0.5) / 0.5, len = Math.hypot(anim.X.E[0] - L.O[0], anim.X.E[1] - L.O[1]);
                cue = [anim.S.G[0] + anim.S.t[0] * w * 3, anim.S.G[1] + anim.S.t[1] * w * 3];
                red = [L.O[0] + anim.S.n[0] * w * len, L.O[1] + anim.S.n[1] * w * len]; }
        }
        const ball = (p, col) => { g.fillStyle = col; g.beginPath(); g.arc(...P(...p), R * sc, 0, TAU); g.fill(); };
        if (!(anim && anim.k >= 1 && anim.X && anim.X.pocket >= 0)) ball(red, '#d23a2f');
        ball(cue, '#f2f0ea');
        $('hud').textContent = `${potted} of ${shots} potted${result ? ' · ' + result : ''}`;
    }
    function shoot() {
        if (!L || (anim && anim.k < 1)) return;
        const S = shot(L.C, L.O, f), X = S.miss ? null : exitOf(L.O, S.n);
        anim = { S, X, k: 0 }; shots++;
        const ok = X && X.pocket >= 0 && POCKETS[X.pocket][0] === L.P[0] && POCKETS[X.pocket][1] === L.P[1];
        const any = X && X.pocket >= 0;
        if (any) potted++;
        result = S.miss ? 'missed the red' : any ? (ok ? 'potted' : 'potted, another pocket') : `cut ${Math.abs(S.phi / D).toFixed(0)}°, needed ${Math.abs(L.phi / D).toFixed(0)}°`;
        const t0 = performance.now(); const step = now => { anim.k = Math.min(1, (now - t0) / 1400); draw(); if (anim.k < 1) requestAnimationFrame(step); };
        requestAnimationFrame(step);
    }
    // aim: drag (or tap) across the view; arrow keys for fine steps
    const aimAt = e => { if (!viewMap || (anim && anim.k < 1)) return; const r = $('view').getBoundingClientRect();
        f = Math.max(-2.4, Math.min(2.4, (e.clientX - r.left - viewMap.cx) / viewMap.unit)); anim = null; result = ''; draw(); };
    let dragging = false;
    $('view').addEventListener('pointerdown', e => { dragging = true; $('view').setPointerCapture(e.pointerId); aimAt(e); });
    $('view').addEventListener('pointermove', e => { if (dragging) aimAt(e); });
    $('view').addEventListener('pointerup', () => { dragging = false; });
    window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { f = Math.max(-2.4, Math.min(2.4, f + (e.key === 'ArrowRight' ? 0.02 : -0.02))); anim = null; result = ''; draw(); e.preventDefault(); }
        if (e.key === ' ' || e.key === 'Enter') { shoot(); e.preventDefault(); }
    });
    $('shoot').addEventListener('click', shoot);
    $('next').addEventListener('click', () => { seed++; newTable(); });
    const slide = k => { if (L && setD(Math.max(1.2, Math.min(16, L.d * k)))) draw(); };
    $('far').addEventListener('click', () => slide(1.5));
    $('near').addEventListener('click', () => slide(1 / 1.5));
    window.addEventListener('resize', draw);
    newTable();

    window.__corner = { shot, cutOf, fFor, layout, place, exitOf, setD: nd => { const ok = setD(nd); draw(); return ok; },
        aim: v => { f = v; anim = null; draw(); }, shoot: () => { shoot(); const r = result; return r; }, current: () => L, R };
})();
</script>
</body>
</html>
