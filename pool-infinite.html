<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
    <title>Infinite table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
    <!--
    pool-infinite.html: the infinite table (11 October 2026; Tom: "the advantage of this is that we could scale it up to
    infinite number of balls, but then zoom in to just see a small percentage of them, and only have to draw or calcualate
    the visible balls"; "yes"). POL run 11 (plans/pol-plan.md) is its test.

    A world of balls of any size, held two ways. Round the reader, a window of balls, one by one, as pool.html plays them
    from inside: each reads the other's v = r/d and is told h = r/d, and equal balls touch at h = v = ½, the corner, found
    exactly within the tick (POL run 9). Everything else is totals: the world is cut into fixed square cells in dyadic
    levels (level 0 is 7.5 units wide, level k 7.5·2^k), and each cell beyond the window holds only its count, momentum and
    energy. A cell is held whole at the level where it reads at the corner from the reader (its size no more than its
    distance) and split while it reads larger, so the cells number about a dozen per level: the work grows with the log of
    the world, not with its balls. A ball leaving the window is folded into the cell it enters; balls enter from each
    neighbouring cell at that cell's one-way flux across a line, n·σ/√(2π); moving or resizing the window unfolds the cells
    it takes in into balls (seeded by their place, carrying exactly their momentum and energy) and folds those it leaves.
    The cells among themselves exchange by diffusion (a chosen model of the far field, D = λ⟨|u|⟩/2, not tested).

    The table loses nothing (no cloth, no cushions, contacts elastic, e = 1), so the world stays alive without a driver
    to choose: a gas of hard discs at area fraction 0.15, each velocity component spread σ = 5.

    Drag to move, wheel or pinch (or − +) to zoom; the window follows the view while a ball is at least a few pixels
    wide, and past that stays as large as it gets: what is too small to see is held as totals. "strike" kicks the balls
    near the middle of the view; the heat then flows out into the cells. "cells" shows the cells' outlines and levels.
    Links: ?zoom= (pixels per unit), ?cells=0. Test hook: window.__infinite (the engine: makeGas, referee, Multi; POL run 11).
    -->
    <style>
    :root { color-scheme: dark; --ground: #0c0c11; --line: rgba(255,255,255,0.12); --ink: #c8c8d0; --dim: #8a8a96;
        --bright: #e6e4ee; --gold: #d4a052 }
    * { box-sizing: border-box }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ground); color: var(--ink);
        font: 13px/1.4 'DM Mono', ui-monospace, monospace; overscroll-behavior: none }
    canvas { position: fixed; inset: 0; display: block; touch-action: none }
    #hud { position: fixed; left: 12px; top: 10px; right: 12px; pointer-events: none; color: var(--bright); white-space: pre-wrap;
        text-shadow: 0 1px 2px #000 }
    #hud .dim { color: var(--dim) }
    #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
        justify-content: center; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: rgba(12,12,17,0.88);
        border-top: 1px solid var(--line) }
    button { font: inherit; color: var(--bright); background: #1d1d27; border: 1px solid var(--line); border-radius: 6px;
        padding: 6px 10px; cursor: pointer; touch-action: manipulation }
    button.go { border-color: var(--gold); color: var(--gold) }
    @media (max-width: 520px) { html, body { font-size: 11.5px } button { padding: 5px 8px } }
    </style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"></div>
<div id="bar">
    <button id="out" aria-label="zoom out">−</button>
    <button id="in" aria-label="zoom in">+</button>
    <button id="strike" class="go">strike</button>
    <button id="cells">cells: on</button>
    <button id="pause">pause</button>
    <button id="full" aria-label="full screen">⛶</button>
</div>
<script>
(() => {
    const $ = id => document.getElementById(id), TAU = 2 * Math.PI;

    // ══ the gas (amounts): radius, area fraction, density, the spread of each velocity component, the tick ══
    const R = 0.45, DIA = 2 * R, PHI = 0.15, N_DENS = PHI / (Math.PI * R * R), SIGMA = 5, TICK = 1 / 240, C0 = 7.5, G = 1.2;
    // kinetic theory of hard discs (Enskog; Henderson's contact value and equation of state), for the far field's diffusion.
    // NU is the rate as POL run 11's plan wrote it, n·(2r)·σ·√π·g = 2.43: the plan took the discs' cross-section as one
    // diameter, but in two dimensions it is two (a centre within a diameter either side of the path), so Enskog's rate is
    // NU_ENSKOG = 4.86 (found in a shakedown before the run; the plan's prediction is kept as written). The far field's
    // diffusion D = λ⟨|u|⟩/2 is the plan's, from its λ = ⟨|u|⟩/NU.
    const G_CONTACT = (1 - 7 * PHI / 16) / (1 - PHI) ** 2, NU = N_DENS * DIA * SIGMA * Math.sqrt(Math.PI) * G_CONTACT, NU_ENSKOG = 2 * NU;
    const MEAN_SPEED = SIGMA * Math.sqrt(Math.PI / 2), LAMBDA = MEAN_SPEED / NU, DIFF = LAMBDA * MEAN_SPEED / 2;
    // run 12: the far field's diffusion from the right rate (λ = 1.29, D = 4.04), and the band at the window's edge, 2 units
    // deep, its balls held at the cells' density and warmth (each redrawn about as often as it would meet another ball)
    const LAMBDA_ENSKOG = MEAN_SPEED / NU_ENSKOG, DIFF_ENSKOG = LAMBDA_ENSKOG * MEAN_SPEED / 2, BAND = 2;
    const SQ2PI = Math.sqrt(2 * Math.PI);

    function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    const gauss = rnd => Math.sqrt(-2 * Math.log(1 - rnd())) * Math.cos(TAU * rnd());
    const hash3 = (a, b, c) => { let h = Math.imul(a | 0, 0x9E3779B1) ^ Math.imul((b | 0) + 0x632BE5AB, 0x85EBCA77) ^ Math.imul((c | 0) + 0x5BD1E995, 0xC2B2AE3D); h ^= h >>> 15; h = Math.imul(h, 0x2C1B3C6D); h ^= h >>> 12; return h >>> 0; };
    const mod = (a, m) => ((a % m) + m) % m;

    // ══ balls, one by one: positions and velocities in typed arrays (a window's in its own local units) ══
    function Balls(cap = 1024) { return { n: 0, x: new Float64Array(cap), y: new Float64Array(cap), vx: new Float64Array(cap), vy: new Float64Array(cap) }; }
    function push(B, x, y, vx, vy) {
        if (B.n === B.x.length) for (const k of ['x', 'y', 'vx', 'vy']) { const a = new Float64Array(2 * B.n); a.set(B[k]); B[k] = a; }
        const i = B.n++; B.x[i] = x; B.y[i] = y; B.vx[i] = vx; B.vy[i] = vy; return i;
    }
    function removeAt(B, i) { const l = --B.n; B.x[i] = B.x[l]; B.y[i] = B.y[l]; B.vx[i] = B.vx[l]; B.vy[i] = B.vy[l]; }

    // ══ contact read from inside. Each ball reads the other's v = r/d and is told its h = r/d; equal balls touch at
    //    h + v = 1 (2r/d = 1, the corner). Found exactly (POL run 9): when the pair has passed h + v = 1 within this tick,
    //    how long ago was it exactly 1? With p the other's place relative to it and w their relative motion, solve
    //    |p − w·τ| = 2r for τ ≥ 0; respond along the line of centres then (equal masses, elastic: the normal parts swap),
    //    and correct each place by its change of motion times τ. ══
    function contact(B, i, j, px, py, dt, ops, onContact) {
        const vx = B.vx, vy = B.vy, wx = vx[j] - vx[i], wy = vy[j] - vy[i], pw = px * wx + py * wy;
        if (!(pw < 0)) return;                                   // drawing apart: no contact
        const a = wx * wx + wy * wy, c = px * px + py * py - DIA * DIA;
        let tau = (pw + Math.sqrt(Math.max(0, pw * pw - a * c))) / a, mx, my;
        if (tau >= 0 && tau <= dt) { const qx = px - wx * tau, qy = py - wy * tau, l = Math.hypot(qx, qy); mx = qx / l; my = qy / l; }
        else {                                                   // set down overlapping (a rare late find): push apart, respond now
            tau = 0; const l = Math.hypot(px, py) || 1; mx = px / l; my = py / l; const s = (DIA - l) / 2;
            B.x[i] -= mx * s; B.y[i] -= my * s; B.x[j] += mx * s; B.y[j] += my * s;
        }
        const wn = wx * mx + wy * my; if (!(wn < 0)) return;
        vx[i] += wn * mx; vy[i] += wn * my; vx[j] -= wn * mx; vy[j] -= wn * my;
        B.x[i] += wn * mx * tau; B.y[i] += wn * my * tau; B.x[j] -= wn * mx * tau; B.y[j] -= wn * my * tau;
        ops.contacts++; if (onContact) onContact(i, j);
    }
    // every pair near enough to touch, through a grid of cells G wide over [0, W) × [0, H) (wrapped round if `wrap`)
    function collide(B, W, H, wrap, dt, ops, onContact) {
        const gw = Math.max(1, Math.floor(W / G)), gh = Math.max(1, Math.floor(H / G)), cw = W / gw, ch = H / gh, n = B.n;
        const head = new Int32Array(gw * gh).fill(-1), next = new Int32Array(n), x = B.x, y = B.y;
        for (let i = 0; i < n; i++) { let cx = Math.floor(x[i] / cw), cy = Math.floor(y[i] / ch); cx = cx < 0 ? 0 : cx >= gw ? gw - 1 : cx; cy = cy < 0 ? 0 : cy >= gh ? gh - 1 : cy; const c = cy * gw + cx; next[i] = head[c]; head[c] = i; }
        const D2 = DIA * DIA, NB = [[1, 0], [-1, 1], [0, 1], [1, 1]];
        for (let cy = 0; cy < gh; cy++) for (let cx = 0; cx < gw; cx++) {
            for (let i = head[cy * gw + cx]; i >= 0; i = next[i]) {
                for (let j = next[i]; j >= 0; j = next[j]) { ops.pairs++; const px = x[j] - x[i], py = y[j] - y[i]; if (px * px + py * py < D2) contact(B, i, j, px, py, dt, ops, onContact); }
                for (const [dx, dy] of NB) {
                    let nx = cx + dx, ny = cy + dy, sx = 0, sy = 0;
                    if (wrap) { if (nx < 0) { nx += gw; sx = -W; } else if (nx >= gw) { nx -= gw; sx = W; } if (ny >= gh) { ny -= gh; sy = H; } }
                    else if (nx < 0 || nx >= gw || ny >= gh) continue;
                    for (let j = head[ny * gw + nx]; j >= 0; j = next[j]) {
                        ops.pairs++; const px = x[j] + sx - x[i], py = y[j] + sy - y[i];
                        if (px * px + py * py < D2) contact(B, i, j, px, py, dt, ops, onContact);
                    }
                }
            }
        }
    }

    // ══ the referee: every ball, a square world of side L wrapped round at its edges (no edge at all) ══
    function makeGas(L, seed) {
        const rnd = rng(seed), N = Math.round(N_DENS * L * L), B = Balls(N), gw = Math.floor(L / G), cell = L / gw, grid = new Map();
        const key = (cx, cy) => mod(cy, gw) * gw + mod(cx, gw);
        while (B.n < N) {   // random placement without overlap
            const x = rnd() * L, y = rnd() * L, cx = Math.floor(x / cell), cy = Math.floor(y / cell); let ok = true;
            for (let dy = -1; dy <= 1 && ok; dy++) for (let dx = -1; dx <= 1 && ok; dx++) for (const j of grid.get(key(cx + dx, cy + dy)) || []) {
                let px = B.x[j] - x, py = B.y[j] - y; px -= L * Math.round(px / L); py -= L * Math.round(py / L);
                if (px * px + py * py < DIA * DIA) { ok = false; break; }
            }
            if (!ok) continue;
            const k = key(cx, cy); if (!grid.has(k)) grid.set(k, []); grid.get(k).push(push(B, x, y, SIGMA * gauss(rnd), SIGMA * gauss(rnd)));
        }
        let mx = 0, my = 0; for (let i = 0; i < N; i++) { mx += B.vx[i]; my += B.vy[i]; } mx /= N; my /= N;
        for (let i = 0; i < N; i++) { B.vx[i] -= mx; B.vy[i] -= my; }   // the world at rest as a whole
        return { B, L, t: 0, ops: { moves: 0, pairs: 0, contacts: 0 } };
    }
    function refereeStep(S, dt, onContact) {
        const B = S.B, L = S.L, n = B.n;
        for (let i = 0; i < n; i++) { let x = B.x[i] + B.vx[i] * dt, y = B.y[i] + B.vy[i] * dt; if (x < 0 || x >= L) x = mod(x, L); if (y < 0 || y >= L) y = mod(y, L); B.x[i] = x; B.y[i] = y; }
        S.ops.moves += n; collide(B, L, L, true, dt, S.ops, onContact); S.t += dt;
    }
    const cloneGas = S => { const B = Balls(S.B.n); B.n = S.B.n; for (const k of ['x', 'y', 'vx', 'vy']) B[k].set(S.B[k].subarray(0, S.B.n)); return { B, L: S.L, t: S.t, ops: { moves: 0, pairs: 0, contacts: 0 } }; };

    // ══ the multiscale world: a window of balls round the reader, and totals in dyadic cells beyond ══
    // Cells are named by level k and index (i, j) in units of their own size (level 0 cells C0 wide); the world is 2^K
    // level-0 cells a side, wrapped round. A cell's totals: N (count), Px, Py (momentum), E (kinetic energy); mass 1.
    const keyOf = (k, i, j) => k + ':' + i + ':' + j;
    // opts (run 12's by default): mode 'band' (the window's edge a band held at the cells' state) or 'edge' (run 11: balls
    // enter at the edge at the cells' one-way flux); quiet: a cell's flow read only above its noise; D: the far field's diffusion
    function Multi(K, w, oi, oj, seed = 1, opts = {}) {
        return { K, S: 2 ** K, w, oi, oj, seed, mode: opts.mode || 'band', quiet: opts.quiet !== false, D: opts.D ?? DIFF_ENSKOG,
            leaves: new Map(), pairs: [], segs: [], B: Balls(1024), closed: false, t: 0, tick: 0,
            ops: { moves: 0, pairs: 0, contacts: 0, tries: 0, cells: 0 }, residual: null, entered: 0, left: 0 };
    }
    const sizeOf = k => C0 * 2 ** k;
    const readerOf = M => [M.oi + M.w / 2, M.oj + M.w / 2];   // in level-0 cell units
    function wrapDist(a, b, S) { const d = mod(a - b, S); return Math.min(d, S - d); }
    function overlap1(a0, alen, b0, blen, S) { return mod(b0 - a0, S) < alen || mod(a0 - b0, S) < blen; }
    const inWindow = (M, i, j) => mod(i - M.oi, M.S) < M.w && mod(j - M.oj, M.S) < M.w;
    // a cell is held whole while it reads no larger than the corner from the reader: its size no more than its distance
    function needSplit(M, k, i, j) {
        if (k === 0) return false;
        const f = 2 ** k, [rx, ry] = readerOf(M);
        if (overlap1(i * f, f, M.oi, M.w, M.S) && overlap1(j * f, f, M.oj, M.w, M.S)) return true;   // the window is in it
        const dx = Math.max(0, wrapDist((i + 0.5) * f, rx, M.S) - f / 2), dy = Math.max(0, wrapDist((j + 0.5) * f, ry, M.S) - f / 2);
        return f > Math.hypot(dx, dy);
    }
    // the totals of cell (k, i, j) from an older set of cells: its share of an older cell that holds it, or the sum of its parts
    function totalsFrom(old, K, k, i, j) {
        for (let kk = k; kk <= K; kk++) {
            const f = 2 ** (kk - k), o = old.get(keyOf(kk, Math.floor(i / f), Math.floor(j / f)));
            if (o) { const s = 1 / (f * f); return { N: o.N * s, Px: o.Px * s, Py: o.Py * s, E: o.E * s }; }
        }
        if (k === 0) return { N: 0, Px: 0, Py: 0, E: 0 };
        const t = { N: 0, Px: 0, Py: 0, E: 0 };
        for (let d = 0; d < 4; d++) { const c = totalsFrom(old, K, k - 1, 2 * i + (d & 1), 2 * j + (d >> 1)); t.N += c.N; t.Px += c.Px; t.Py += c.Py; t.E += c.E; }
        return t;
    }
    // the cells for the present window and reader: one cover of the world outside the window, each cell read at the corner
    function recover(M, old) {
        const nl = new Map(), visit = (k, i, j) => {
            if (needSplit(M, k, i, j)) { for (let d = 0; d < 4; d++) visit(k - 1, 2 * i + (d & 1), 2 * j + (d >> 1)); return; }
            if (k === 0 && inWindow(M, i, j)) return;                 // a window cell: its balls are held one by one
            nl.set(keyOf(k, i, j), { k, i, j, A: sizeOf(k) ** 2, ...totalsFrom(old, M.K, k, i, j) });
        };
        visit(M.K, 0, 0); M.leaves = nl; adjacency(M);
    }
    // the cell (or the window) holding level-0 cell (a, b)
    function leafAt(M, a, b) {
        a = mod(a, M.S); b = mod(b, M.S);
        for (let k = 0; k <= M.K; k++) { const f = 2 ** k, l = M.leaves.get(keyOf(k, Math.floor(a / f), Math.floor(b / f))); if (l) return l; }
        return null;
    }
    // which cells touch which (for the far field's diffusion), and which cell lies beyond each level-0 stretch of the window's edge
    function adjacency(M) {
        // each stretch of boundary between two cells, found once: from the cell on its left (or below), walking up its
        // right (or top) side; a stretch beside the window (a level-0 cell holding balls) is not a pair of cells
        const pairs = [];
        for (const l of M.leaves.values()) {
            const f = 2 ** l.k;
            for (const right of [true, false]) {
                for (let t = 0; t < f;) {
                    const a = right ? (l.i + 1) * f : l.i * f + t, b = right ? l.j * f + t : (l.j + 1) * f, o = leafAt(M, a, b);
                    let step = 1;
                    if (o) { const g = 2 ** o.k; step = Math.min(f - t, g - mod(right ? b - o.j * g : a - o.i * g, M.S)); }
                    if (o && o !== l) pairs.push({ a: l, b: o, len: step * C0, gap: (sizeOf(l.k) + sizeOf(o.k)) / 2 });
                    t += Math.max(1, step);
                }
            }
        }
        M.pairs = pairs;
        const segs = [], w = M.w, W = w * C0;
        for (let r = 0; r < w; r++) segs.push(
            { cell: [M.oi - 1, M.oj + r], x: 0, y: r * C0, along: [0, 1], nrm: [1, 0] },
            { cell: [M.oi + w, M.oj + r], x: W * (1 - 1e-12), y: r * C0, along: [0, 1], nrm: [-1, 0] },
            { cell: [M.oi + r, M.oj - 1], x: r * C0, y: 0, along: [1, 0], nrm: [0, 1] },
            { cell: [M.oi + r, M.oj + w], x: r * C0, y: W * (1 - 1e-12), along: [1, 0], nrm: [0, -1] });
        for (const s of segs) s.leaf = leafAt(M, ...s.cell);
        M.segs = segs;
    }
    // a cell's reading: its density, its flow, its spread (warmth). With `quiet` (run 12) the flow is taken only where it is
    // more than three times its own noise, σ/√N; otherwise there is no flow and all the energy is warmth.
    const stateOf = (l, quiet) => {
        const N = l.N > 1e-12 ? l.N : 1e-12; let ux = l.Px / N, uy = l.Py / N, s2 = Math.max(0, l.E / N - 0.5 * (ux * ux + uy * uy));
        if (quiet && Math.hypot(ux, uy) <= 3 * Math.sqrt(s2 / N)) { ux = 0; uy = 0; s2 = Math.max(0, l.E / N); }
        return { n: l.N / l.A, ux, uy, sigma: Math.sqrt(s2) };
    };
    const addTo = (l, N, Px, Py, E) => { l.N += N; l.Px += Px; l.Py += Py; l.E += E; };

    // unfold cell (i, j) (its totals t) into balls in the window: as many as it holds (the fraction left to the cells), placed
    // at random without overlap (seeded by its place), with velocities carrying exactly its momentum and energy
    function unfold(M, i, j, t, place) {
        const k = Math.max(0, Math.round(t.N)), rnd = rng(hash3(mod(i, M.S), mod(j, M.S), M.seed));
        const s = t.N > 0 ? k / t.N : 0, Px = t.Px * s, Py = t.Py * s, E = t.E * s;
        M.residual.N += t.N - k; M.residual.Px += t.Px - Px; M.residual.Py += t.Py - Py; M.residual.E += t.E - E;
        if (!k) return;
        const x0 = mod(i - M.oi, M.S) * C0, y0 = mod(j - M.oj, M.S) * C0, idx = [];
        for (let m = 0; m < k; m++) {
            let x = 0, y = 0;
            for (let tries = 0; tries < 200; tries++) { x = x0 + rnd() * C0; y = y0 + rnd() * C0; if (place.free(x, y)) break; }
            idx.push(push(M.B, x, y, gauss(rnd), gauss(rnd))); place.add(x, y);
        }
        // shift to the cell's mean motion and scale to its energy, exactly
        const B = M.B; let mx = 0, my = 0; for (const q of idx) { mx += B.vx[q]; my += B.vy[q]; } mx /= k; my /= k;
        let th = 0; for (const q of idx) { const dx = B.vx[q] - mx, dy = B.vy[q] - my; th += 0.5 * (dx * dx + dy * dy); }
        const want = E - 0.5 * (Px * Px + Py * Py) / k, sc = th > 0 && want > 0 ? Math.sqrt(want / th) : 0;
        for (const q of idx) { B.vx[q] = Px / k + (B.vx[q] - mx) * sc; B.vy[q] = Py / k + (B.vy[q] - my) * sc; }
    }
    // a placing grid for unfolding without overlap
    function placer(M) {
        const W = M.w * C0, gw = Math.max(1, Math.floor(W / G)), cell = W / gw, grid = new Map(), key = (cx, cy) => cy * 1e6 + cx;
        const add = (x, y) => { const k = key(Math.floor(x / cell), Math.floor(y / cell)); if (!grid.has(k)) grid.set(k, []); grid.get(k).push([x, y]); };
        for (let q = 0; q < M.B.n; q++) add(M.B.x[q], M.B.y[q]);
        const free = (x, y) => { const cx = Math.floor(x / cell), cy = Math.floor(y / cell);
            for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) for (const [px, py] of grid.get(key(cx + dx, cy + dy)) || []) if ((px - x) ** 2 + (py - y) ** 2 < DIA * DIA) return false;
