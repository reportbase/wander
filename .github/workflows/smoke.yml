name: Smoke test

# Run by hand only (Actions tab, "Run workflow"). Since 3 Nov 2026 (Tom: "Yes, I'm tired of your excessive testing.")
# it no longer runs on every pull request or push.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
