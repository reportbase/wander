<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--
flight.html: the corner in a flight sim (10 October 2026). Tom: "you know how the transition from earth to the sky in
flight sim games is awkward? ... i wonder if its because of the corner"; "only the geometry i'm interested, so the demos
can be wire frame"; "show the corner and how it is uniform before the corner and logrithmic after"; "each Level has its
own corner".

Level flight at height v over a ground grid, wireframe. A ground line h ahead lands v/h below eye level (x/h across),
so the corner, the ground line h = v, sits on the same screen row at every height. The strip on the right is the
reading folded at the corner: home to corner as h/v (equal ground steps, equal ticks), corner onward as v/h (they crowd;
2v, 4v, 8v each take half the room of the last).

LOD (set by ?lod=; the chips were removed at Tom's "remove the buttons in the upper left"): none, 10 m everywhere; by metres, the engine's way, spacing doubling at 500 m, 1 km, 2 km ...;
by v/h, levels split at v, 2v, 4v ...: the first from home to the corner, the second from the corner to 2v, each after
twice as long with twice the grain (v/8 in the first two), so every level holds 8 lines. There is one corner, the split
between the first level and the second (Tom, superseding "each Level has its own corner": "I don't think there are corners
in the far field. there is only one corner that splits far field from the near field, which is just the split between the
first and second octive"). By v/h the count past the corner is 8 lines a level, logarithmic, and climbing changes nothing
on the screen; by metres the edges slide as you climb. The doublings are plain, ordinary arithmetic, with no depth and no
recursion between them (Tom: "there is no depth or recursion because we create the unit circle when we assign V to H";
"its plain doublings, ordinary math. but now we know why, its a consequence of setting V = H, which creates the unit
circle"; SPN R188). Here V = H is set by measuring v and h in the same unit, metres.
The main view is the grid alone (Tom: "remove the non-gridlines on the main view"; the corner and the level edges are on
the strip) and a few posts standing on the ground. The perturbed sphere is gone (Tom: "remove the pertibuated circle,
focus on recovering the universe with a sweep"; "a circle is not needed. only the sweep is needed"; "we don't need to
point to everyting in the universe just a few things, just to illustrate the point").
Recovering the world from the sweep (after draw.html's UDV lab, with one reader moving instead of three standing): the
reader holds, for the top and the foot of each post, only its reading, how far down from eye level and how far across,
each against the distance ahead, to the nearest pixel (the screen's step). It keeps its readings from a second ago, when
it stood one second of travel back (v a second, so one v) and, if it climbed, at its own earlier height. The two
standpoints' lines cross at the place: ahead and across from the down readings and the across readings, the height from
either. Its own travel is the one length, so places come out in units of v. No circle, no census. Where the two down
readings fall on the same pixel the lines do not cross on the screen's step and the place is unresolved: only its
bearing is known. Posts come in from about 24v and are replaced once passed.
The panel at bottom left is the lay: the ground laid on the reader's addresses, centred on home, the plane flying up the
page (Tom: "the corner is the unit circle itself, by setting V = H. we create the corner circle"; "that unit circle
contains the address space to the entire universe. not part of it, all of it. however, the corner circle has a radius of
H"; "think of the corner circle expanding logrithmically, but reality itself does not expand logrithmically just our
representation of it"; "it will look like the mercator map"; and before: "reality is perfect represented at home, no
distortion"; "two things are needed, assign V=H and swap v/h with h/v at the corner"; "the sweep creates the addresses to
the complete universe, addresses, not the universe. so for illustration purposes, we can lay a portion of the universe
onto the sweep itself, like the ring metaphore"). A ground point ρ from home is laid at its own direction and radius
ρ/v inside the corner circle (gold, radius one H), 1 + ln(ρ/v) past it: the world at its own scale out to the corner,
then every doubling the same width (the dashed rings at 2v, 4v, …), out to 64v here and without end. White rings are
the posts, teal dots where the reader places them, a faint ray a bearing alone.
How far the reader can place things is set by its step, not by the corner: one v of travel moves a post's down reading
by about f·v/h² pixels (f the screen's focal length in pixels), so placing gives out near h = √f·v, about 16v on a
laptop screen; there a one-pixel difference places it badly, and past it only the bearing is left. That is the
resolution limit, a pair of amounts (the travel and the pixel), physics; inside a few v the places come back to within
about ten per cent.
Drag up or down (touch or mouse), wheel or arrow keys to change v.
The strip (set by ?strip=) unfolds it (Tom: "what happens if we don't flip at the corner?"): h/v all the way keeps the near
side and runs off the top past 2v (the far field never reaches v/h = 0: the uniform grid); v/h all the way keeps the far
side and runs off the bottom inside v/2 (home never reached: the level main view). Folded, both ends are held.
Links: ?v=  ?lod=none|metres|vh  ?strip=folded|h/v|v/h  ?still=1. Test hook: window.__flight (recoverAt).
-->
<title>The corner in flight</title>
<style>
  /* Layout: one full-screen canvas, one chip, one small readout. Single dark wireframe look. */
  :root {
    --bg: #07090b;
    --ink: #9fb0bb;
    --corner: #e2b545;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: ns-resize; }
  #read {
    position: fixed; left: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    font: 13px/1.4 var(--mono); color: var(--ink); pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  #read b { color: var(--corner); font-weight: 500; }
</style>

<canvas id="c" aria-label="Wireframe ground seen from a plane in level flight"></canvas>
<div id="read"></div>

<script>
const cv = document.getElementById('c');
const g = cv.getContext('2d');
const read = document.getElementById('read');

const S = 10;          // finest ground grid spacing, metres
const FAR = 20000;     // where the ground stops being drawn, metres
const MODES = ['none', 'by metres', 'by v/h'];
const Q = new URLSearchParams(location.search);
let mode = Math.max(0, ['none', 'metres', 'vh'].indexOf(Q.get('lod')));
let v = Math.min(5000, Math.max(2, +Q.get('v') || 120));
const still = Q.get('still') === '1';  // v: height of the plane, metres
let travelled = 0;
let W, H, f, cx, cy, dpr;

function size() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2;
  cy = H * 0.35;              // eye level (camera is level)
  f = H * 0.35;               // so the corner, v/h = 1, sits at cy + f
}
window.addEventListener('resize', size);
size();

// a ground point h ahead and x across, seen from height v
const px = (x, h) => cx + f * x / h;
const py = (h) => cy + f * v / h;

// Bands of ground: from h = a to h = b, lines every s metres.
function bands() {
  const out = [];
  if (mode === 0) {
    out.push({ a: 0, b: FAR, s: S });
  } else if (mode === 1) {
    // engine style: spacing doubles at fixed distances 500 m, 1 km, 2 km ...
    let a = 0, b = 500, s = S;
    while (a < FAR) { out.push({ a, b: Math.min(b, FAR), s }); a = b; b *= 2; s *= 2; }
  } else {
    // by the reading (Tom: "there is only one corner that splits far field from the near field, which is just the split
    // between the first and second octive"): the first level runs from home to the corner, h = v, the next from v to 2v,
    // then 2v to 4v ...; one grain, v/8, in the first two, then doubling, so every level holds 8 lines
    out.push({ a: 0, b: v, s: v / 8 });
    let a = v, b = 2 * v, s = v / 8;
    while (a < FAR) { out.push({ a, b: Math.min(b, FAR), s }); a = b; b *= 2; s *= 2; }
  }
  return out;
}

// cross lines anchored to the ground, so they stream past as we fly
function eachCross(B, hMin, fn) {
  for (const { a, b, s } of B) {
    const lo = Math.max(a, hMin);
    if (lo >= b) continue;
    for (let k = Math.ceil((travelled + lo) / s); ; k++) {
      const h = k * s - travelled;
      if (h >= b) break;
      fn(h, s);
    }
  }
}

function draw() {
  g.fillStyle = '#07090b';
  g.fillRect(0, 0, W, H);

  const hNear = Math.max(f * v / (H - cy) * 0.95, 0.01);
  const B = bands();
  const far = new Path2D(), near = new Path2D();

  // lines running ahead (constant x), band by band
  for (const { a, b, s } of B) {
    const lo = Math.max(a, hNear);
    if (lo >= b) continue;
    const xMax = b * (cx + 2) / f;
    for (let k = Math.ceil(-xMax / s); k <= Math.floor(xMax / s); k++) {
      const x = k * s;
      far.moveTo(px(x, lo), py(lo));
      far.lineTo(px(x, b), py(b));
    }
  }
  // lines running across (constant h)
  eachCross(B, hNear, (h) => {
    const xs = h * (cx + 2) / f;
    const p = h < v ? near : far;
    p.moveTo(px(-xs, h), py(h)); p.lineTo(px(xs, h), py(h));
  });

  g.lineWidth = 1;
  g.strokeStyle = 'rgba(190,205,215,0.38)'; g.stroke(far);
  g.strokeStyle = 'rgba(110,190,230,0.75)'; g.stroke(near);

  drawPosts(hNear);
  drawPlan();

  drawReading(B);

  read.innerHTML = `v ${v < 10 ? v.toFixed(1) : Math.round(v)} m · ${recovered} of ${NPOST} placed from one v of travel · drag to climb`;
}

// ── A few posts, and recovering them from the sweep ──
// A post stands at Z (along the flight, world), X (across), from the ground to height T. The reader reads, for its top and
// its foot, a = across/ahead and s = down-from-eye/ahead, each to the nearest pixel (step 1/f). Two standpoints: now, and a
// second ago (z1, v1). Crossing the down readings: v1 − y = s1(Z − z1), v2 − y = s2(Z − z2), so
// Z = (v1 − v2 + s1·z1 − s2·z2)/(s1 − s2), y = v2 − s2(Z − z2), X = a2(Z − z2). Same pixel twice: unresolved, bearing a only.
const NPOST = 6, BACK = 1;                  // six posts; the second standpoint one second (one v of travel) back
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const posts = [];
function newPost(far) {
  const h = far ? v * (16 + 16 * rnd()) : v * Math.pow(2, 0.3 + 4.3 * rnd());     // ahead: 1.2v … 24v at the start
  return { Z: travelled + h, X: (rnd() - 0.5) * 0.9 * h, T: v * (0.3 + 1.2 * rnd()), hist: [] };
}
for (let i = 0; i < NPOST; i++) posts.push(newPost(false));

let clock = 0;
const pix = (r, grain) => grain > 0 ? Math.round(r * grain) / grain : r;   // a reading to the nearest pixel
function readPoint(Z, X, y, z, vv, grain) {
  const d = Z - z;
  return { a: pix(X / d, grain), s: pix((vv - y) / d, grain) };
}
function cross(p1, p2) {                    // p: { z, v, a, s } from two standpoints; returns place or bearing
  if (p1.s === p2.s) return { bearing: p2.a };
  const Z = (p1.v - p2.v + p1.s * p1.z - p2.s * p2.z) / (p1.s - p2.s);
  const d = Z - p2.z;
  if (!(d > 0)) return { bearing: p2.a };
  return { Z, X: p2.a * d, y: p2.v - p2.s * d };
}
function recoverPost(P) {
  if (!P.hist.length) return null;
  let old = null;
  for (const e of P.hist) if (clock - e.t >= BACK) old = e;
  if (!old) return null;
  const now = P.hist[P.hist.length - 1];
  const foot = cross(old.foot, now.foot), top = cross(old.top, now.top);
  return { foot, top, z: now.foot.z, v: now.foot.v };
}
function sensePosts() {
  for (let i = 0; i < NPOST; i++) {
    const P = posts[i];
    if (P.Z - travelled < 0.5 * v) { posts[i] = newPost(true); continue; }
    const fo = readPoint(P.Z, P.X, 0, travelled, v, f), to = readPoint(P.Z, P.X, P.T, travelled, v, f);
    P.hist.push({ t: clock, foot: { z: travelled, v, ...fo }, top: { z: travelled, v, ...to } });
    while (P.hist.length > 2 && clock - P.hist[1].t >= BACK) P.hist.shift();
  }
}
function drawPosts(hNear) {
  g.strokeStyle = 'rgba(235,240,245,0.9)'; g.lineWidth = 1.5;
  g.beginPath();
  for (const P of posts) {
    const d = P.Z - travelled;
    if (d < hNear) continue;
    const X = cx + f * P.X / d;
    g.moveTo(X, cy + f * v / d); g.lineTo(X, cy + f * (v - P.T) / d);
  }
  g.stroke(); g.lineWidth = 1;
}
// ── The lay: the world laid on the reader's addresses, centred on home ──
// Tom, 10 Oct: "the corner is the unit circle itself, by setting V = H. we create the corner circle"; "that unit circle
// contains the address space to the entire universe. not part of it, all of it. however, the corner circle has a radius
// of H"; "think of the corner circle expanding logrithmically, but reality itself does not expand logrithmically just our
// representation of it"; "it will look like the mercator map".
// A ground point at distance ρ from home, in direction φ, is laid at direction φ and radius r(ρ): ρ/v inside the corner
// (the world at its own scale; perfect at home), 1 + ln(ρ/v) past it, so every doubling gets the same width, ln 2, and the
// slope meets the near field's at the corner with no kink. The plane flies up the page; home is the centre.
const LAY_OUT = 64;                              // laid out to 64v
const layR = (rho) => rho <= v ? rho / v : 1 + Math.log(rho / v);
let recovered = 0;
function drawPlan() {
  const sz = Math.min(W * 0.46, H * 0.62, 420), x0 = 16, y1 = H - 40, y0 = y1 - sz;
  const ox = x0 + sz / 2, oy = y0 + sz / 2;
  const k = (sz / 2 - 4) / layR(LAY_OUT * v);
  const at = (X, dZ) => { const rho = Math.hypot(X, dZ); if (rho === 0) return [ox, oy];
    const r = layR(rho) * k; return [ox + r * X / rho, oy - r * dZ / rho]; };
  g.fillStyle = 'rgba(7,9,11,0.9)'; g.fillRect(x0, y0, sz, sz);
  g.strokeStyle = 'rgba(190,205,215,0.3)'; g.strokeRect(x0 + 0.5, y0 + 0.5, sz, sz);
  g.save(); g.beginPath(); g.rect(x0, y0, sz, sz); g.clip();

  // the ground grid, world-anchored, coarser by the doubling so each level holds about the same number of lines
  const grid = new Path2D();
  const levels = [[0, v, v / 4]];
  for (let a = v, s = v / 4; a < LAY_OUT * v; a *= 2, s *= 2) levels.push([a, 2 * a, s]);
  for (const [a, b, s] of levels) {
    const n = Math.ceil(b / s), step = s / 3;
    const inBand = (X, dZ) => { const r = Math.hypot(X, dZ); return r >= a && r < b; };
    const line = (P) => { let pen = false;
      for (let u = -b; u <= b; u += step) { const [X, dZ] = P(u), [X2, dZ2] = P(u + step);
        if (inBand((X + X2) / 2, (dZ + dZ2) / 2)) { const p1 = at(X, dZ), p2 = at(X2, dZ2);
          if (!pen) grid.moveTo(p1[0], p1[1]); grid.lineTo(p2[0], p2[1]); pen = true; } else pen = false; } };
    const z0 = travelled % s;                        // across lines move with the flight
    for (let i = -n; i <= n; i++) {
      const X = i * s, dZ = i * s - z0;
      line(u => [X, u]);                             // along the flight
      line(u => [u, dZ]);                            // across it
    }
  }
  g.strokeStyle = 'rgba(190,205,215,0.28)'; g.lineWidth = 1; g.stroke(grid);

  // the level edges past the corner (each one doubling, the same width), and the corner circle itself
  g.strokeStyle = 'rgba(230,120,140,0.5)'; g.setLineDash([3, 4]);
  for (let a = 2 * v; a < LAY_OUT * v; a *= 2) { g.beginPath(); g.arc(ox, oy, layR(a) * k, 0, 2 * Math.PI); g.stroke(); }
  g.setLineDash([]);
  g.strokeStyle = 'rgba(226,181,69,0.9)'; g.lineWidth = 1.5;
  g.beginPath(); g.arc(ox, oy, k, 0, 2 * Math.PI); g.stroke(); g.lineWidth = 1;

  // the posts: rings where they are, teal where the reader places them, a faint ray for a bearing alone
  recovered = 0;
  for (const P of posts) {
    const dZ = P.Z - travelled, [tx, ty] = at(P.X, dZ);
    g.strokeStyle = 'rgba(235,240,245,0.85)';
    g.beginPath(); g.arc(tx, ty, 4, 0, 2 * Math.PI); g.stroke();
    const r = recoverPost(P);
    if (!r) continue;
    if (r.foot.bearing !== undefined) {
      const [bx, by] = at(r.foot.bearing * LAY_OUT * v, LAY_OUT * v);
      g.strokeStyle = 'rgba(140,230,205,0.35)';
      g.beginPath(); g.moveTo(ox, oy); g.lineTo(bx, by); g.stroke();
    } else {
      recovered++;
      const [rx, ry] = at(r.foot.X, r.foot.Z - r.z);
      g.fillStyle = 'rgba(140,230,205,0.95)';
      g.beginPath(); g.arc(rx, ry, 2.5, 0, 2 * Math.PI); g.fill();
    }
  }
  g.fillStyle = '#e8eef2'; g.beginPath(); g.moveTo(ox, oy - 6); g.lineTo(ox - 4, oy + 3); g.lineTo(ox + 4, oy + 3); g.fill();
  g.restore();
}

// The reading on the strip: folded at the corner (h/v, then v/h), or one ratio all the way (flip off).
const FLIPS = ['folded', 'h/v', 'v/h'];
let flip = Math.max(0, FLIPS.indexOf(new URLSearchParams(location.search).get('strip')));
function stripY(h, top, mid, bot, half) {
  if (flip === 1) return bot - (h / v) * half;                          // h/v throughout: 2v at the top, beyond off
  if (flip === 2) return h >= v ? mid - (1 - v / h) * half              // v/h throughout: v/2 at the bottom, inside off
                                : mid + (v / h - 1) * half;
  return h <= v ? bot - (h / v) * half : mid - (1 - v / h) * half;      // folded at the corner
}
// Home to corner: h/v, from 0 to 1. Corner onward: v/h, from 1 back to 0.
function drawReading(B) {
  const top = H * 0.08, bot = H * 0.86;
  const mid = (top + bot) / 2, half = (bot - top) / 2;
  const x0 = W - 56, w = 22;
  // folded: h/v to the corner, v/h past it. Unflipped, one ratio all the way: h/v runs off the top past 2v,
  // v/h runs off the bottom inside v/2.
  const yOf = (h) => stripY(h, top, mid, bot, half);

  g.strokeStyle = 'rgba(190,205,215,0.25)';
  g.strokeRect(x0 + 0.5, top + 0.5, w, bot - top);

  g.save();
  g.beginPath(); g.rect(x0 - 8, top, w + 16, bot - top); g.clip();
  const nearT = new Path2D(), farT = new Path2D(), edgeT = new Path2D();
  eachCross(B, 0.0001, (h) => {
    const y = Math.round(yOf(h)) + 0.5;
    const p = h < v ? nearT : farT;
    p.moveTo(x0, y); p.lineTo(x0 + w, y);
  });
  for (const { a } of B) {
    if (a <= 0) continue;
    const y = Math.round(yOf(a)) + 0.5;
    edgeT.moveTo(x0 - 2, y); edgeT.lineTo(x0 + w + 6, y);
  }
  g.strokeStyle = 'rgba(190,205,215,0.6)'; g.stroke(farT);
  g.strokeStyle = 'rgba(110,190,230,0.9)'; g.stroke(nearT);
  g.setLineDash([3, 3]);
  g.strokeStyle = 'rgba(230,120,140,0.85)'; g.stroke(edgeT);
  g.setLineDash([]);

  // doublings past the corner: 2v, 4v, 8v ... each takes half the room of the last
  g.restore();
  g.font = '11px ui-monospace, Menlo, Consolas, monospace';
  g.textAlign = 'right'; g.textBaseline = 'middle';
  g.fillStyle = '#9fb0bb'; g.strokeStyle = '#9fb0bb';
  let n = 2;
  for (let k = 1; k <= 4; k++, n *= 2) {
    const y = yOf(n * v);
    if (y < top + 6 || y > bot) continue;
    g.beginPath(); g.moveTo(x0 - 4, y); g.lineTo(x0, y); g.stroke();
    g.fillText(n + 'v', x0 - 6, y);
  }

  g.strokeStyle = '#e2b545'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(x0 - 4, mid); g.lineTo(x0 + w + 4, mid); g.stroke();
  g.lineWidth = 1;
  g.fillStyle = '#e2b545'; g.fillText('corner', x0 - 6, mid);
  g.fillStyle = '#9fb0bb';
  g.fillText(flip === 2 ? 'v/h = 2' : 'home', x0 - 6, bot);
  g.fillText(flip === 1 ? 'h/v = 2' : 'v/h → 0', x0 - 6, top);

  // the posts on the strip: filled where the reader has placed one, a ring where it holds a bearing only
  for (const P of posts) {
    const hs = P.Z - travelled; if (!(hs > 0)) continue;
    const y = yOf(hs), off = y < top || y > bot, r = recoverPost(P);
    g.fillStyle = g.strokeStyle = 'rgba(140,230,205,0.95)';
    g.beginPath(); g.arc(x0 + w / 2, Math.min(bot, Math.max(top, y)), 3.5, 0, 2 * Math.PI);
    if (!off && r && r.foot.bearing === undefined) g.fill(); else g.stroke();
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (!still) {
    travelled += v * dt;                        // ground speed v a second: the same at any height
    clock += dt;
    sensePosts();
  }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// LOD: tap or click the chip, or press L

// test hook: rows on the screen are fractions of its height, so they compare across sizes
window.__flight = {
  set(h, m) { v = h; mode = ['none', 'metres', 'vh'].indexOf(m); },
  cornerRow: () => py(v) / H,
  edgeRows: () => bands().filter(b => b.a > 0 && b.a < FAR).map(b => py(b.a) / H),
  // a point hv ahead, xv across, yv up (all in v), read from now and from one v back, each reading to `grain` steps per
  // unit (0: exact); returns the recovered place in v, or { bearing } when the two down readings match
  recoverAt: (hv, xv, yv, grain) => {
    const V = 1, Z = hv, z1 = -1, z2 = 0;
    const r1 = readPoint(Z, xv, yv, z1, V, grain), r2 = readPoint(Z, xv, yv, z2, V, grain);
    const c = cross({ z: z1, v: V, ...r1 }, { z: z2, v: V, ...r2 });
    return c.bearing !== undefined ? c : { h: c.Z - z2, x: c.X, y: c.y };
  },
  focal: () => f,
  layR: (hv) => layR(hv * v),
  stripAt: (hv, m) => { const k = flip; flip = FLIPS.indexOf(m); const y = stripY(hv * v, 0, 0.5, 1, 0.5); flip = k; return 1 - y; },   // 0 bottom … 1 top
  linesPerLevel: () => bands().filter(b => b.b < FAR).map(b => (b.b - b.a) / b.s),
};

// climbing: drag (mouse or touch), wheel, arrow keys
const clamp = (a) => Math.min(5000, Math.max(2, a));
let dragY = null;
cv.addEventListener('pointerdown', e => { dragY = e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (dragY === null) return;
  v = clamp(v * Math.exp((dragY - e.clientY) * 0.01));
  dragY = e.clientY;
});
const end = () => { dragY = null; };
cv.addEventListener('pointerup', end);
cv.addEventListener('pointercancel', end);
cv.addEventListener('wheel', e => { e.preventDefault(); v = clamp(v * Math.exp(-e.deltaY * 0.002)); }, { passive: false });
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') v = clamp(v * 1.1);
  if (e.key === 'ArrowDown') v = clamp(v / 1.1);
});
</script>
